// 答えを待つ：黙って考えていても、最長5分は聞き取りを続ける
const V_WAIT=5*60*1000;
function listenAnswer(q,until){
  if(!until)until=Date.now()+V_WAIT;
  if(!vOn||!session||session.answered)return;
  if(Date.now()>until){vStatus("⏸ 長く答えがなかったので聞き取りを休みました。「もう一度読む」で再開できます");return}
  vListen((w,t)=>{
    if(w==="calc")return vCalcListen(t,()=>listenAnswer(q,until));
    if(w==="stop")return vEnd();
    if(w==="o"||w==="x")return answer(q,w);
    if(w==="unknown")return answer(q,"u");
    if(w==="pass")return doPass(q);
    if(w==="repeat")return voiceAfterRender(q,null);
    listenAnswer(q,until);
  },why=>{
    if(why==="nomic"){vStatus("このページではマイクが使えません");vMicNote();return}

// 時間切れつきの通信（返事が来ないまま待ち続けないように）

// 使えるAI（Geminiのモデル）の候補を、良さそうな順に並べる。うまくいったものを覚えておく
async function aiModels(key){
  let names=[];
  try{
    const r=await fetchTO("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000",{headers:{"x-goog-api-key":key}},12000);
    if(r.status===400||r.status===401||r.status===403){const j=await r.json().catch(()=>({}));const e=new Error("key");e.detail=aiDetail(r.status,j);throw e}
    if(r.ok){const j=await r.json();
      names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""))
        .filter(n=>/^gemini-[\d.]+-flash/.test(n)&&!/image|tts|audio|live|embed|vision|native|computer/.test(n));
      const ver=n=>parseFloat((n.match(/gemini-([\d.]+)/)||[0,0])[1]);
      const score=n=>ver(n)*10-(/lite/.test(n)?5:0)-(/preview|exp/.test(n)?1:0);
      names.sort((a,b)=>score(b)-score(a));
    }
  }catch(e){if(e.message==="key")throw e}
  const saved=lsGet(AI_MODEL),pref=saved&&!/lite/.test(saved)?saved:"";
  if(saved&&!pref)lsSet(AI_MODEL,"");
  return [...new Set([pref,...names,"gemini-flash-latest","gemini-flash-lite-latest","gemini-2.5-flash","gemini-2.5-flash-lite"].filter(Boolean))];
}
function aiDetail(status,j){const m=j&&j.error&&(j.error.message||j.error.status);return `（${status}${m?"："+String(m).slice(0,120):""}）`}
async function aiCall(contents,onStep,opt){
  opt=opt||{};

  onStep&&onStep("使えるAIを調べています…");
  const list=(await aiModels(key)).slice(0,5);
  let last=null;const fails=[];
  for(const [i,model] of list.entries()){
    onStep&&onStep(`${model} につないでいます（${i+1}/${list.length}）…`);
    let r,j={};
    try{r=await fetchTO(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({systemInstruction:{parts:[{text:opt.sys||TUT_SYS}]},contents,generationConfig:{temperature:opt.temp!=null?opt.temp:0.4,maxOutputTokens:opt.sys?2048:4096}})},25000)}

      const er=new Error("net");er.detail="";throw er}
    j=await r.json().catch(()=>({}));

    if(r.ok){
      const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
      const t=parts.filter(p=>!p.thought).map(p=>p.text||"").join("");

      if(!opt.sys&&!/lite/.test(model))lsSet(AI_MODEL,model);aiUse(true);
      if(!opt.sys)lsSet(AI_LAST,JSON.stringify({m:model,why:fails.join(" ／ "),d:today()}));   // 家庭教師で、軽量版でないときだけ覚える

    }

    if(!opt.sys&&lsGet(AI_MODEL)===model)lsSet(AI_MODEL,"");
  }
  throw last||new Error("other");
}

const AI_ERR={nokey:"ホーム画面の「AI家庭教師」でGeminiのキーを入れると使えます。",key:"キーが正しくないようです。ホーム画面の「AI家庭教師」でキーを確かめてください。",limit:"今日の無料分の上限に達したようです。下の「Claudeで聞く」を使うか、明日また使ってください。",net:"Geminiに接続できませんでした。電波を確かめてください。claude.aiの中では使えないことがあるので、そのときはGitHub Pages版で使ってください。",model:"使えるAIの種類が見つかりませんでした。少し待ってからもう一度試してください。",timeout:"AIの返事が来ませんでした（混雑しているようです）。少し待ってからもう一度試してください。",region:"お住まいの地域ではGeminiの無料APIが使えないようです。「Claudeで聞く」を使ってください。",empty:"AIから返事がありませんでした。言い方を変えて、もう一度送ってください。",other:"AIでエラーが起きました（混雑など）。少し待ってからもう一度送ってください。"};

function lap2Split(){
  const order=THEMES.map(t=>t.id),d=Math.max(1,daysLeft());
  const r1=order.reduce((n,t)=>n+thItems(t).filter(q=>!card(q.id)).reduce((s,q)=>s+Wt(q),0),0);
  const all=order.reduce((n,t)=>n+thItems(t).reduce((s,q)=>s+Wt(q),0),0);
  const r2=order.reduce((n,t)=>n+thItems(t).filter(q=>{const c=card(q.id);return c&&!c.l2}).reduce((s,q)=>s+Wt(q),0),0);
  if(!r1)return {lap:2,d,r2,q2:Math.ceil(r2/d)};

  if((d>=0&&d<=fin&&weak.length>=10)||(!rest.length&&!rest2.length&&weak.length))return {d:today(),mode:"final",ids:weak.slice(0,40).map(q=>q.id),th:[],v:5,pm:paceKey(),quota:40};
  const days=d>fin?d-fin:Math.max(d,1);
  const all=order.reduce((n,t)=>n+thItems(t).reduce((s,q)=>s+W(q),0),0);
  const tot=(lap2?rest2:rest).reduce((s,q)=>s+W(q),0);
  const L2=PC.m==="2"?lap2Split():null;
  const quota=PC.m==="n"?Math.max(5,+PC.n||40)
    :PC.m==="2"?Math.max(15,Math.min(150,L2.lap===2?L2.q2:L2.q1))

  const P=S.pass||{};
  for(const q of passQ())if(P[q.id]<today()&&!card(q.id)&&!isDojoQ(q)){ids.push(q.id);w+=W(q)}
  for(const tid of order){
    const L=lap2?thItems(tid).filter(q=>{const c=card(q.id);return c&&!c.l2}):thItems(tid).filter(q=>!card(q.id)&&!(S.pass&&S.pass[q.id]));if(!L.length)continue;

// 「もう少し進む」：今日もう解いた問題は予定に残したまま、次の1日分を後ろに足す（済みの数が0に戻らないように）
function morePlan(){
  const old=getPlan(),p=makePlan(),M=AMAP();
  const keep=(old.ids||[]).filter(id=>{const k=card(id);return k&&k.t===today()});
  p.ids=[...new Set(keep.concat(p.ids))];
  p.th=[...new Set((old.th||[]).concat(p.th))].filter(t=>p.ids.some(id=>(M.get(id)||{}).th===t));
  p.base=old.base||old.quota;p.more=(old.more||0)+1;

}
function quotaFor(m){const o=S.pace;S.pace={...pace(),m,v:2};let q=0;try{q=makePlan().quota||0}finally{S.pace=o}return q}
function getPlan(){
  const c=C0(),old=c.plan;
  if(!old||old.d!==today()||old.v!==5||old.pm!==paceKey()){
    const p=makePlan();p.v=5;
    if(old&&old.d===today()&&p.mode===old.mode){
      // 今日もう解いた分は残し、新しい問題は「1日の量」から解いた分を引いた残りだけ足す（1日の量がふくらまないように）
      const M=AMAP(),W=q=>q&&q.oyo?4:1,keep=(old.ids||[]).filter(id=>{const k=card(id);return k&&k.t===today()});
      let w=keep.reduce((n,id)=>n+W(M.get(id)),0);const add=[];
      for(const id of p.ids){if(keep.includes(id))continue;if(w>=(p.quota||0))break;add.push(id);w+=W(M.get(id))}
      p.ids=keep.concat(add);
      const ths=new Set(p.ids.map(id=>(M.get(id)||{}).th).filter(Boolean));
      p.th=[...new Set((old.th||[]).concat(p.th))].filter(t=>ths.has(t));
    }

  }

}
function planItems(p){const M=AMAP();return p.ids.map(id=>M.get(id)).filter(q=>q&&!isDojoQ(q))}   // 計算問題は計算道場で解くので、今日の予定には出さない

let HIDMS=0,hidAt=0;document.addEventListener("visibilitychange",()=>{if(document.hidden)hidAt=Date.now();else if(hidAt){HIDMS+=Date.now()-hidAt;hidAt=0}});

function tmPush(k,sec,keep){S.tm=S.tm||{};S.tm[k]=(S.tm[k]||[]).concat(sec).slice(-keep)}
// 1問・1レッスンあたりの時間：自分の実績の平均（極端な2割を除く）。初めて解いた問題の記録を優先し、少ないうちは全部の記録、それもなければ仮の値
function perQ(){
  const t=S.tm||{},avg=a=>{a=a.slice().sort((x,y)=>x-y);const c=Math.floor(a.length*.1),m=a.slice(c,a.length-c||a.length);return Math.round(m.reduce((s,x)=>s+x,0)/m.length)};
  const pick=(k1,k0,n,def)=>(t[k1]||[]).length>=n?[avg(t[k1]),"new"]:(t[k0]||[]).length>=n?[avg(t[k0]),"all"]:[def,""];
  const [b,sb]=pick("b1","b",10,90),[o,so]=pick("o1","o",3,720),[l,sl]=(t.l||[]).length>=3?[avg(t.l),"new"]:[180,""];

const doneToday=(q,p)=>{const c=card(q.id);return !!(c&&c.t===p.d)};
function startCourse(){
  const p=getPlan(),pend=planItems(p).filter(q=>!doneToday(q,p));

  const go=()=>{if(pend.length){start(pend,p.mode==="final"?"仕上げ":"今日のレッスン");session.lap=p.lap||1}else{lesson=null;render()}};
  // レッスンを読み終えたテーマの残り（昨日の続きなど）を先に解き、そのあと新しいテーマのレッスンへ
  const old=pend.filter(q=>!unread.includes(q.th));

// ペースのひとこと：責めずに、続けられる目安を出す（最近7日の平均と、試験までに1周目を終える目安を比べる）
function paceHTML(X){
  const solved=Object.keys(S.cards||{}).length,lrn=X.filter(x=>x.s.st==="lrn").length;
  // ペースは初めて解いた問題（1周目）だけで数える。記録を始めて7日たつまでは、始めてからの日数で割る
  let w7=0;for(let i=0;i<7;i++)w7+=(S.nlog||{})[addDays(-i)]||0;
  const nd=S.nlogStart?Math.min(7,Math.max(1,daysBetween(S.nlogStart,today())+1)):7,avg=Math.round(w7/nd);
  // 選んだペースに合わせて目安を出す：1周＝試験日までに1周目／2周＝仕上げ（試験3週間前）までに1周目を終え、仕上げで2周目

function oyoParts(q){
  if(q.ans.length<2)return null;
  const flat=q.t.replace(/\n(?![〈《【〔「]|[①-⑳Ⅰ-Ⅻ]\s|\(\d)/g,"");
  const sents=flat.split(/(?<=。)|\n/).map(x=>x.trim()).filter(Boolean),lines=q.t.split("\n"),out=[];
  const qi=lines.findIndex(l=>/^\s*[①-⑳]\s/.test(l)),lead=qi>0?lines.slice(0,qi).join("").trim():"";   // 問いの前の前提の文
  for(const [k] of q.ans){
    if(!k)return null;
    const re=new RegExp("（\\s*"+k+"\\s*）"),i=sents.findIndex(x=>re.test(x));
    if(i>=0){out.push({i:out.length,k,b:1,pre:i>0&&!/^[〈《【〔]/.test(sents[i-1])?sents[i-1]:"",s:sents[i]});continue}
    const ln=lines.find(l=>new RegExp("^\\s*"+k+"\\s").test(l));
    if(ln){out.push({i:out.length,k,b:0,pre:lead,s:ln.trim()});continue}
    // 「①○○と②△△を求めなさい」のように1文に並んでいるとき

    return false;
  }
  if(!done){if(w==="reveal"||w==="next"||w==="unknown"||w==="o"||w==="x"){oyoShow(q);return true}if(w==="pass"){doPass(q);return true}return false}
  if(done.step){if(["next","sure","o","pass"].includes(w)){oyoFinish(q);return true}if(w==="tutor"){tutorVoice(q,done,true);return true}return false}
  if(w==="tutor"){tutorVoice(q,done,true);return true}
  if(w==="sure"||w==="o"){oyoRate(q,"sure");return true}
  if(w==="unsure"||w==="next"){oyoRate(q,"unsure");return true}
  if(w==="miss"||w==="x"||w==="unknown"){oyoRate(q,"wrong");return true}
  return false;
}
function oyoListen(q,done,until){
  if(!until)until=Date.now()+V_WAIT*(done?2:1);
  if(!vOn||!session||session.answered!==done)return;
  if(Date.now()>until){vStatus("⏸ 聞き取りを休みました。「もう一度読む」で再開できます");return}
  vListen((w,t)=>{if(w==="calc")return vCalcListen(t,()=>oyoListen(q,done,until));if(!oyoWord(q,done,w))oyoListen(q,done,until)},why=>{
    if(why==="nomic"){vStatus("このページではマイクが使えません");vMicNote();return}
    setTimeout(()=>oyoListen(q,done,until),300);
  });
}
