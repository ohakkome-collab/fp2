<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>FP2級 合格ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
/* Layout: one-column phone app — header strip, scrolling sheet, fixed bottom tab bar. Ledger-paper ground, ink-navy text, hanko-red for mistakes, pine-green for correct. */
:root{
  --bg:#f3f4ef; --sheet:#fbfbf8; --ink:#1d2433; --sub:#5d6474; --line:#d9dccf;
  --accent:#23407a; --accent-soft:#e3e9f5; --ok:#1f7a55; --ok-soft:#e0f1e8;
  --ng:#b8322a; --ng-soft:#f8e3e0; --warn:#9a6a00; --warn-soft:#fbefd2;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c; --sheet:#1a1e27; --ink:#e7e9ee; --sub:#9aa1b0; --line:#2c3240;
  --accent:#8fb0ee; --accent-soft:#223050; --ok:#5ccf9b; --ok-soft:#173528;
  --ng:#f08a80; --ng-soft:#3d1e1c; --warn:#e7b94f; --warn-soft:#3a2f14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --sheet:#1a1e27; --ink:#e7e9ee; --sub:#9aa1b0; --line:#2c3240;
  --accent:#8fb0ee; --accent-soft:#223050; --ok:#5ccf9b; --ok-soft:#173528;
  --ng:#f08a80; --ng-soft:#3d1e1c; --warn:#e7b94f; --warn-soft:#3a2f14; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:8px 4px}
header.top h1{font-family:var(--display);font-weight:900;font-size:1.35rem;margin:0;letter-spacing:.04em}
header.top .sync{font-size:.75rem;color:var(--sub)}
h2{font-family:var(--display);font-size:1.1rem;margin:0;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px}
.muted{color:var(--sub);font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;color:var(--sub);font-weight:700}
.big{font-family:var(--display);font-size:2.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;font-weight:700;border-radius:8px;padding:12px 14px;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
.btn:focus-visible,.tab:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.today{display:flex;gap:16px;align-items:center}
.today .grow p{margin:4px 0 0}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.kaisei{background:var(--warn-soft);color:var(--warn)}
.chip.ng{background:var(--ng-soft);color:var(--ng)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.field{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field .name{font-weight:700;font-size:.95rem}
.field .nums{font-size:.8rem;color:var(--sub);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--ok)} .bar .l{background:var(--accent);opacity:.55} .bar .w{background:var(--ng)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--sub)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--sub)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font-size:1.05rem;line-height:1.85;margin:0;white-space:pre-wrap}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .btn{font-family:var(--display);font-size:2rem;min-height:84px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;font:inherit;color:var(--ink);text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;min-height:48px}
.opt b{font-family:var(--display);color:var(--accent)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.verdict{display:flex;align-items:center;gap:12px}
.stamp{font-family:var(--display);font-weight:900;font-size:1.6rem;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:3px solid currentColor;transform:rotate(-8deg);flex:none}
.stamp.ok{color:var(--ok)} .stamp.ng{color:var(--ng)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:press .22s ease-out}}
@keyframes press{from{transform:scale(1.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.exp{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:0;white-space:pre-wrap}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--sub);font-weight:700}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
.form3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:flex-start;padding-block:12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow p{margin:2px 0 0;font-size:.9rem}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.item .acts .btn{min-height:40px;padding:6px 10px;font-size:.85rem}
a{color:var(--accent)}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tab{appearance:none;border:0;background:none;font:inherit;color:var(--sub);font-size:.72rem;font-weight:700;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.note{font-size:.78rem;color:var(--sub);line-height:1.6}
.empty{text-align:center;padding:24px 8px;color:var(--sub)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ng);color:var(--sheet);font-size:.75rem;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.rate3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.rate3 .btn{padding:10px 6px;font-size:.85rem}
.exam{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.cell{appearance:none;font:inherit;font-size:.7rem;font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:4px;aspect-ratio:1;max-width:100%;padding:0;cursor:pointer;min-width:0}
.cell.m{background:var(--ok);border-color:var(--ok);color:var(--sheet)}.cell.l{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}.cell.w{background:var(--ng);border-color:var(--ng);color:var(--sheet)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.qimg{display:block;width:100%;max-width:100%;height:auto;border-radius:6px;background:#fff;border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qimg{filter:invert(.88) hue-rotate(180deg)}}
:root[data-theme="dark"] .qimg{filter:invert(.88) hue-rotate(180deg)}
.lawnote{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.88rem;line-height:1.7}
.lawnote strong{display:block;color:var(--warn)}
.qpre{margin:0;font-size:1rem;line-height:1.8;padding:6px 10px;border-left:3px solid var(--accent);border-radius:4px;background:color-mix(in srgb,var(--accent) 8%,transparent);white-space:pre-wrap}
.qpre b{margin-right:6px}
.qhead2{margin:0;font-size:.85rem;line-height:1.7;color:var(--sub);white-space:pre-wrap}
.imgbox summary,.sibs summary{cursor:pointer;font-size:.85rem;font-weight:700;color:var(--accent);padding-block:4px}
.imgbox[open] summary{margin-bottom:6px}
.sibs ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.sibs li{display:flex;gap:8px;font-size:.88rem;line-height:1.65;padding:6px 8px;border-radius:6px}
.sibs li.me{background:var(--accent-soft)}
.sibs b{font-family:var(--display);flex:none}
.tok{color:var(--ok)} .tng{color:var(--ng)}
.tf .btn.isans{border-width:3px;border-color:currentColor}
.unk{font-size:.95rem;min-height:48px;color:var(--sub)}
.unk.mine{border-width:3px;border-color:var(--sub)}
.stamp.uk{color:var(--sub)}
.calc summary{cursor:pointer;font-size:.9rem;font-weight:700;color:var(--accent);padding-block:4px}
.calc .disp{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums;margin-block:6px}
.calc .ex{font-size:.95rem;color:var(--sub);min-height:1.4em;word-break:break-all}
.calc .res{font-size:1.5rem;font-weight:700;min-height:1.4em;word-break:break-all}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys .btn{min-height:46px;font-size:1.1rem;padding:4px}
.calc .keys .op{color:var(--accent)}
.tutlog{display:flex;flex-direction:column;gap:8px}
.tmsg{border-radius:10px;padding:8px 10px;line-height:1.7;white-space:pre-wrap;font-size:.95rem}
.tmsg.me{align-self:flex-end;background:var(--accent);color:var(--sheet);max-width:85%}
.tmsg.ai{background:var(--bg);border:1px solid var(--line)}
.tmsg.err{color:var(--ng);font-size:.85rem}
.tspk{float:right;min-height:32px;padding:2px 8px;margin:0 0 4px 6px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{min-height:40px;font-size:.85rem;padding:4px 10px}
.tact{margin-top:6px}
.tutf{margin-top:8px;gap:8px}.tutf .btn{font-size:1.5rem;min-height:56px}.tsave{min-height:34px;font-size:.8rem;padding:2px 10px}
.tnote{margin-top:6px;font-size:.8rem;color:var(--ok)}
.expbox.mine{border-color:var(--accent)}
.term{all:unset;cursor:pointer;color:inherit;text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.term:focus-visible{outline:2px solid var(--accent);border-radius:2px}
#glPop{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--sheet);border-top:2px solid var(--accent);box-shadow:0 -4px 16px rgba(0,0,0,.15)}
#glPop .glin{max-width:640px;margin:0 auto}
.ptwrap summary{cursor:pointer;font-size:.85rem;font-weight:700;color:var(--accent);padding-block:4px}.ptwrap[open] summary{margin-bottom:6px}
.ptbox{border:2px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.ptbox .pt1{font-weight:700;margin:4px 0;line-height:1.7}
.ptbox .ptc{margin:4px 0;line-height:1.7}
.ptr{margin:4px 0 0;padding-left:1.2em;line-height:1.7}.ptr li{margin-bottom:3px}
.stuck li{display:flex;justify-content:space-between;gap:8px;padding-block:4px;border-bottom:1px solid var(--line);font-size:.9rem}
.vbar{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px dashed var(--line)}
.vbar .btn{min-height:40px;padding:6px 12px;font-size:.85rem}
.vmic{color:var(--ng)}
.seg{display:flex;flex-direction:column;gap:6px}
.segopt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700;font-size:.92rem}
.segopt input{width:auto;min-height:0;accent-color:var(--accent)}
.segopt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
label.chk{display:flex;gap:8px;align-items:center;font-size:.85rem}
label.chk input{width:auto;min-height:0}
.expbox{background:var(--bg);border-radius:8px;padding:12px 14px}
.expbox p{margin:4px 0 0;line-height:1.8;font-size:.98rem;white-space:pre-line}
.dj [data-rate] .muted,.dj [data-orate] .muted,.dj [data-ores] .muted{display:none}
.sibs li small{display:block;color:var(--sub);font-size:.8rem;margin-top:2px}
.src summary{cursor:pointer;font-size:.78rem;color:var(--sub)}
.src p{font-size:.75rem;color:var(--sub);line-height:1.6;margin:6px 0 0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.steps{margin:0;padding-left:1.4em;line-height:1.9}.steps li.ok{color:var(--ok)}
.course{border:2px solid var(--accent)}
.tmap{display:flex;flex-wrap:wrap;gap:6px}
.tdot{appearance:none;font:inherit;font-size:.78rem;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:99px;padding:4px 10px;min-height:34px;cursor:pointer}
.tdot.lrn{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tdot.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tdot.mast{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.lsn{margin:0;padding-left:1.3em;line-height:1.85}.lsn li{margin-bottom:8px}
.oblanks{display:flex;flex-wrap:wrap;gap:6px}
.ocur{color:var(--accent);background:var(--accent-soft,rgba(0,0,0,.06));border-radius:4px;padding:0 2px}
.presum{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.presum .pr{display:grid;grid-template-columns:8em 1fr;gap:8px;padding:5px 0;border-top:1px dashed var(--line);font-size:.92rem;line-height:1.6}
.presum .label+.pr{border-top:0}
.qtext.sets{font-size:.9rem;line-height:1.7;max-height:55vh;overflow:auto}
.qtext mark{background:var(--ok-soft);color:inherit;border-radius:4px;padding:0 2px}
.oans{background:var(--ok-soft);border:1px solid var(--ok);border-radius:8px;padding:10px 12px;font-size:1.15rem}.oans b{color:var(--accent);margin-right:6px}
.oblank{min-height:42px;padding:4px 12px;font-variant-numeric:tabular-nums}
.oblank b{color:var(--accent);margin-right:4px}
.oblank.on,.oblank.on:disabled{opacity:1;background:var(--ok-soft);border-color:var(--ok);cursor:default}
.ostep{background:var(--bg);border-radius:8px;padding:10px 12px}.ostep ol{margin:4px 0 8px;padding-left:1.4em;line-height:1.8}
.imgbox img+img{margin-top:6px}
</style>

<script>
/* ===== 問題データ（すべてオリジナル作成。FP1アプリのオリジナル問題をそのまま使用。法令基準日2026年10月1日で作成） ===== */
const CATS={L:"ライフプランニング",R:"リスク管理",K:"金融資産運用",T:"タックスプランニング",F:"不動産",S:"相続・事業承継"};
const Q=[
// ---- ライフ ----
{id:"L01",c:"L",k:1,q:"2026年度の老齢基礎年金の満額（67歳以下の人）は、847,300円である。",a:"o",e:"2026年度の満額は847,300円（68歳以上は844,900円）。2025年度は831,700円だったので、年度ごとの金額の違いに注意。"},
{id:"L02",c:"L",k:1,q:"2026年4月以降、在職老齢年金は、総報酬月額相当額と老齢厚生年金の基本月額の合計が51万円を超えると、超えた額の2分の1が支給停止となる。",a:"x",e:"基準額は65万円に引き上げられた（2025年度は51万円）。「超えた額の2分の1が止まる」という仕組みは変わらない。"},
{id:"L03",c:"L",k:1,q:"離婚時の年金分割の請求期限は、原則として離婚等をした日の翌日から5年以内である。",a:"o",e:"従来の2年以内から5年以内に延長された。"},
{id:"L04",c:"L",k:1,q:"2026年10月から、1歳未満の子を養育する国民年金第1号被保険者は、届出により国民年金保険料が免除され、その期間は保険料納付済期間として扱われる。",a:"o",e:"育児期間の免除制度の創設。実母は産前産後免除の後から、それ以外の人は出産後から、子が1歳になる月の前月までが対象。年金額は減らない（納付済扱い）。"},
{id:"L05",c:"L",k:0,q:"1962年4月2日以後生まれの人が老齢基礎年金を繰り上げて受給する場合、減額率は1カ月あたり0.5％である。",a:"x",e:"減額率は1カ月あたり0.4％（60歳0カ月で最大24％減）。0.5％は以前の率。繰下げの増額率は1カ月あたり0.7％で、75歳まで（最大84％増）。"},
{id:"L06",c:"L",k:1,q:"フラット35の借入額の上限は8,000万円である。",a:"x",e:"上限は1億2,000万円に引き上げられた。また一戸建て等の床面積要件は70㎡以上から50㎡以上に緩和（マンション等は30㎡以上のまま）。"},
{id:"L07",c:"L",k:1,q:"企業型DCのマッチング拠出では、加入者掛金の額を事業主掛金の額以下としなければならない。",a:"x",e:"この「事業主掛金以下」という制限は撤廃された。拠出限度額の範囲内であれば、加入者掛金が事業主掛金を上回ってもよい。"},
{id:"L08",c:"L",k:1,q:"出生後休業支援給付金は、一定の要件を満たす育児休業について、28日を限度に休業開始時賃金日額の13％相当額が支給されるもので、育児休業給付金（67％）とあわせると80％となる。",a:"o",e:"2025年4月創設。夫婦それぞれが通算14日以上の育休を取ることなどが要件。手取りでみるとほぼ10割になる。"},
{id:"L09",c:"L",k:1,q:"育児時短就業給付金は、3歳未満の子を養育するために時短勤務をしている場合に、時短勤務中の賃金の20％を上限に支給される。",a:"x",e:"対象は2歳未満の子。支給額は原則として時短勤務中の賃金の10％。"},
{id:"L10",c:"L",k:1,q:"自己都合で退職した人に対する基本手当の給付制限期間は、原則として1カ月である。",a:"o",e:"2025年4月から原則2カ月→1カ月に短縮。なお、退職前1年以内に一定の教育訓練を受けた場合などは給付制限なし。"},
{id:"L11",c:"L",k:1,q:"2025年4月以降に60歳になった人の高年齢雇用継続基本給付金の給付率は、最大で各月の賃金の15％である。",a:"x",e:"最大10％に縮小された（賃金が60歳時点の64％以下に下がった場合）。"},
{id:"L12",c:"L",k:0,q:"健康保険の傷病手当金は、支給を始めた日から通算して1年6カ月まで支給される。",a:"o",e:"途中で出勤した期間があっても、その分は延長され「通算」1年6カ月になる。支給額は標準報酬日額の3分の2相当。"},
{id:"L13",c:"L",k:0,q:"出産育児一時金の額は、産科医療補償制度に加入している医療機関で出産した場合、1児につき50万円である。",a:"o",e:"2023年4月から50万円（未加入の医療機関では48万8,000円）。"},
{id:"L14",c:"L",k:1,q:"労災保険の葬祭料は、33万円に給付基礎日額の30日分を加えた額（その額が給付基礎日額の60日分に満たない場合は60日分）である。",a:"o",e:"定額部分が31万5,000円から33万円に引き上げられた。"},
{id:"L15",c:"L",k:1,q:"高等学校等就学支援金は、世帯の収入が一定額以下の場合に限り支給される。",a:"x",e:"所得制限が撤廃され、保護者の収入にかかわらず支給されるようになった。"},
{id:"L16",c:"L",k:0,q:"加給年金額の対象となる配偶者が、厚生年金の被保険者期間20年以上の老齢厚生年金の受給権を有している場合、実際に受給していなくても加給年金額は支給停止となる。",a:"o",e:"2022年4月以降は「受給権があるかどうか」で判断する。"},
{id:"L17",c:"L",k:1,q:"日本政策金融公庫の教育一般貸付（国の教育ローン）の返済期間は、最長18年である。",a:"x",e:"2025年4月から最長20年に延長された。"},
{id:"L18",c:"L",k:1,q:"2026年8月から、高額療養費の自己負担限度額が引き上げられるとともに、年間での上限額が新たに設けられた。",a:"o",e:"月ごとの上限に加え、年間の上限が新設された。"},
{id:"L19",c:"L",k:0,type:"mc",q:"1961年10月生まれの人が、老齢基礎年金を72歳0カ月で繰下げ受給した場合の増額率として、正しいものはどれか。",ch:["42.0％","50.4％","58.8％","84.0％"],a:2,e:"65歳から72歳0カ月までは84カ月。84×0.7％＝58.8％。"},
// ---- リスク ----
{id:"R01",c:"R",k:1,q:"2026年分・2027年分の所得税では、23歳未満の扶養親族がいる場合、新契約の一般生命保険料控除の適用限度額が6万円に引き上げられる。",a:"o",e:"通常4万円のところ6万円に（時限措置）。子育て世帯への支援が目的。"},
{id:"R02",c:"R",k:1,q:"経済価値ベースのソルベンシー比率の導入に伴い、早期是正措置の対象となる基準は「200％未満」とされた。",a:"x",e:"新方式では基準は100％未満。200％未満は従来方式（ソルベンシー・マージン比率）の基準。"},
{id:"R03",c:"R",k:0,q:"生命保険契約者保護機構による補償は、破綻時点の責任準備金等の90％まで（高予定利率契約を除く）である。",a:"o",e:"「保険金額の90％」ではなく「責任準備金等の90％」である点がひっかけポイント。"},
{id:"R04",c:"R",k:0,q:"地震保険の保険金額は、主契約である火災保険の保険金額の30％～50％の範囲内で、建物5,000万円、家財1,000万円が上限である。",a:"o",e:"損害区分は全損・大半損・小半損・一部損の4区分で、それぞれ保険金額の100％・60％・30％・5％。"},
{id:"R05",c:"R",k:0,q:"法人が契約する定期保険で、最高解約返戻率が50％超70％以下の場合、保険期間の前半4割の期間は支払保険料の40％を資産計上し、60％を損金に算入する。",a:"o",e:"70％超85％以下なら60％資産計上・40％損金。85％超は解約返戻率に応じた別の計算。50％以下は全額損金（原則）。"},
{id:"R06",c:"R",k:0,q:"契約者（保険料負担者）が夫、被保険者が妻、死亡保険金受取人が子である生命保険で、妻が死亡し子が受け取った死亡保険金は、相続税の課税対象となる。",a:"x",e:"契約者・被保険者・受取人がすべて別人なので贈与税の対象。相続税になるのは「契約者＝被保険者」で受取人が別のとき。"},
{id:"R07",c:"R",k:0,q:"自動車損害賠償責任保険の支払限度額は、被害者1人につき死亡3,000万円、傷害120万円、後遺障害は最高4,000万円である。",a:"o",e:"自賠責は対人賠償のみ。物損は対象外。"},
{id:"R08",c:"R",k:0,q:"借家人が軽過失により借家を焼失させた場合、失火責任法により、家主に対する損害賠償責任を負わない。",a:"x",e:"家主には「元の状態で返す」約束を果たせない（債務不履行）ため、軽過失でも責任を負う。失火責任法で守られるのは隣家などへの不法行為責任。"},
{id:"R09",c:"R",k:0,q:"保険契約のクーリング・オフは、契約の申込日または契約申込書面の交付日のいずれか遅い日から8日以内に行う必要があり、書面のほか電磁的記録でも行うことができる。",a:"o",e:"保険期間1年以内の契約や、法人が結ぶ契約、医師の診査を受けた契約などは対象外。"},
{id:"R10",c:"R",k:0,q:"個人年金保険料控除の適用を受けるためには、年金受取人が契約者またはその配偶者であり、確定年金の場合は年金受取期間が10年以上であることなどの要件を満たす必要がある。",a:"o",e:"ほかに、保険料払込期間10年以上、年金開始が60歳以後などの要件がある。"},
// ---- 金融 ----
{id:"K01",c:"K",k:1,q:"TOPIX（東証株価指数）は、東京証券取引所のプライム市場に上場する全銘柄を対象とする指数である。",a:"x",e:"組入れ対象はプライム・スタンダード・グロースの全市場区分に広がった。日経平均株価はプライム市場の225銘柄。"},
{id:"K02",c:"K",k:1,q:"投資信託協会と日本投資顧問業協会は統合し、資産運用業協会となった。",a:"o",e:"運用業界の自主規制団体が1つにまとまった。"},
{id:"K03",c:"K",k:0,q:"NISAの成長投資枠の年間投資枠は240万円、つみたて投資枠は120万円であり、非課税保有限度額は合計1,800万円（うち成長投資枠1,200万円）である。",a:"o",e:"非課税期間は無期限。売却すると、その簿価分の枠が翌年以降に復活する。"},
{id:"K04",c:"K",k:0,q:"外貨預金は、預金保険制度による保護の対象である。",a:"x",e:"外貨預金は対象外。決済用預金（無利息・要求払い・決済サービス）は全額保護、それ以外は元本1,000万円とその利息まで。"},
{id:"K05",c:"K",k:0,q:"上場株式の配当について確定申告をする場合、所得税と個人住民税とで異なる課税方式を選択することができる。",a:"x",e:"2024年分以後は、所得税で選んだ方式が住民税にも自動的に適用される（一致させる）。"},
{id:"K06",c:"K",k:0,q:"J-REIT（上場不動産投資信託）から受け取る分配金は、総合課税を選択すれば配当控除の適用を受けることができる。",a:"x",e:"J-REITの分配金は配当控除の対象外。"},
{id:"K07",c:"K",k:0,q:"米ドルの外貨預金に円を預け入れる際に適用される為替レートは、TTM（仲値）に1円を加えたTTSである。",a:"o",e:"預け入れ（円→外貨）はTTS、払い戻し（外貨→円）はTTB（TTM－1円）。"},
{id:"K08",c:"K",k:0,q:"シャープレシオは、ポートフォリオの収益率から無リスク資産利子率を差し引いた値を、ポートフォリオの標準偏差で割って求める。",a:"o",e:"リスク1単位あたりの超過リターン。数値が大きいほど効率よく運用できたと判断する。"},
{id:"K09",c:"K",k:0,q:"金融サービス提供法では、金融商品販売業者等が重要事項の説明義務に違反した場合、元本欠損額が顧客の損害額と推定される。",a:"o",e:"顧客は損害額を自分で証明しなくてよい。断定的判断の提供も禁止されている。"},
{id:"K10",c:"K",k:0,q:"日本投資者保護基金は、証券会社が破綻し、分別管理の不備などで顧客資産が返還されない場合に、顧客1人あたり1,000万円まで補償する。",a:"o",e:"銀行で購入した投資信託は対象外（銀行は基金の会員ではない）。"},
{id:"K11",c:"K",k:0,q:"プットオプションの買い手は、原資産価格が下落した場合に利益が得られ、損失はプレミアム（オプション料）に限定される。",a:"o",e:"売り手は利益がプレミアムに限られ、損失は大きくなりうる。"},
{id:"K12",c:"K",k:0,type:"mc",q:"表面利率1.0％、残存期間5年の固定利付債券を98円で購入した場合の最終利回り（単利・年率）に最も近いものはどれか。",ch:["1.02％","1.22％","1.43％","1.40％"],a:2,e:"{1.0＋(100－98)÷5}÷98×100＝1.4÷98×100≒1.4286％。分母は購入価格。"},
{id:"K13",c:"K",k:0,type:"mc",q:"当期純利益50億円、自己資本500億円、総資産1,250億円の企業のROE（自己資本利益率）はどれか。",ch:["4％","10％","25％","40％"],a:1,e:"ROE＝当期純利益÷自己資本×100＝50÷500×100＝10％。総資産で割るとROA（4％）。"},
{id:"K14",c:"K",k:0,q:"特定公社債の利子は、申告分離課税の対象であるが、確定申告不要を選択することもできる。",a:"o",e:"税率は20.315％。申告分離を選べば上場株式等の譲渡損失と損益通算できる。"},
// ---- タックス ----
{id:"T01",c:"T",k:1,q:"2026年分の所得税において、合計所得金額2,350万円以下の人に適用される基礎控除の本則の額は62万円である。",a:"o",e:"58万円→62万円に引き上げ。さらに合計所得489万円以下の人は42万円加算で104万円（2026・2027年分）。"},
{id:"T02",c:"T",k:1,type:"mc",q:"2026年分の所得税で、合計所得金額が500万円の人の基礎控除額はどれか。",ch:["104万円","67万円","62万円","58万円"],a:1,e:"489万円超655万円以下は67万円。489万円以下なら104万円、655万円超2,350万円以下は62万円。"},
{id:"T03",c:"T",k:1,q:"2026年分の所得税において、配偶者控除・扶養控除の対象となる親族の合計所得金額の要件は、58万円以下である。",a:"x",e:"基礎控除の引上げにあわせて4万円引き上げられ、62万円以下になった。勤労学生控除は89万円以下。"},
{id:"T04",c:"T",k:1,q:"2026年分・2027年分の給与所得控除の最低保障額は、74万円である。",a:"o",e:"本則が65万円→69万円、さらに2年間の特例で5万円加算され74万円。"},
{id:"T05",c:"T",k:1,q:"マイカー通勤者の通勤手当の非課税限度額は、片道55km以上の場合の月額38,700円が上限である。",a:"x",e:"距離区分が増え、片道95km以上で月額66,400円が上限になった。"},
{id:"T06",c:"T",k:1,q:"確定拠出年金の老齢給付金を一時金で受け取った後、9年以内に退職一時金を受け取った場合、勤続期間が重なる部分は退職一時金の退職所得控除の計算から除かれる。",a:"o",e:"従来は4年以内とされていた。受け取る順番によって有利不利が出ないように見直された。"},
{id:"T07",c:"T",k:0,type:"mc",q:"勤続30年（障害者になったことによる退職ではない）の会社員が退職金2,500万円を受け取った。退職所得の金額はどれか。",ch:["500万円","1,000万円","650万円","1,250万円"],a:0,e:"退職所得控除＝800万円＋70万円×(30年－20年)＝1,500万円。(2,500万円－1,500万円)×1/2＝500万円。"},
{id:"T08",c:"T",k:1,q:"中小企業者等の少額減価償却資産の特例では、取得価額40万円未満の資産について、取得価額の全額を損金に算入することができる。",a:"o",e:"30万円未満から40万円未満に引き上げ。対象法人は従業員400人以下に変更（従前500人以下）。"},
{id:"T09",c:"T",k:1,q:"防衛特別法人税は、2026年4月1日以後に開始する事業年度から、基準法人税額から500万円を控除した額に4％の税率を乗じて課される。",a:"o",e:"基礎控除500万円があるため、多くの中小法人は実際には課税されない。"},
{id:"T09b",c:"T",k:1,q:"住宅ローン控除は、2030年12月31日までに居住した場合に適用でき、控除率は年末残高の1％である。",a:"x",e:"適用期限は2030年末まで延長されたが、控除率は0.7％のまま。"},
{id:"T10",c:"T",k:0,q:"法人が支出した得意先との飲食費のうち、1人あたり1万円以下のものは、一定の書類を保存すれば交際費等から除かれる。",a:"o",e:"2024年4月以後、5,000円以下から1万円以下に引き上げられた。"},
{id:"T11",c:"T",k:0,q:"無申告加算税の割合は、納付すべき税額のうち300万円を超える部分について30％である。",a:"o",e:"50万円以下の部分15％、50万円超300万円以下の部分20％、300万円超の部分30％。"},
{id:"T12",c:"T",k:0,q:"不動産所得の損失の金額のうち、土地を取得するための負債の利子に相当する部分は、他の所得と損益通算することができない。",a:"o",e:"建物部分の利子は通算できる。別荘など生活に通常必要でない資産の貸付による損失も通算不可。"},
{id:"T13",c:"T",k:0,q:"上場株式等の譲渡損失は、確定申告をすることにより、翌年以後5年間にわたって繰り越すことができる。",a:"x",e:"繰越しは3年間。純損失の繰越し（青色申告）も原則3年間。"},
{id:"T14",c:"T",k:0,type:"mc",q:"一時払養老保険（契約者・被保険者・受取人が同じ本人）の満期保険金600万円を受け取った。払込保険料は500万円で、ほかに一時所得はない。総所得金額に算入される金額はどれか。",ch:["100万円","50万円","25万円","0円"],a:2,e:"一時所得＝600万円－500万円－特別控除50万円＝50万円。総所得金額にはその2分の1の25万円を算入。"},
{id:"T15",c:"T",k:0,q:"医療費控除の控除額は、支払った医療費（保険金などで補てんされる額を除く）から、10万円と総所得金額等の5％のいずれか低い額を差し引いた額で、上限は200万円である。",a:"o",e:"セルフメディケーション税制は1万2,000円を超える部分で上限8万8,000円。両方の併用はできない。"},
{id:"T16",c:"T",k:1,q:"特定親族特別控除は、居住者と生計を一にする19歳以上23歳未満の親族で、一定の所得要件を満たす者がいる場合に適用される。",a:"o",e:"大学生世代の子がアルバイトで特定扶養親族から外れても、所得に応じて段階的に控除を受けられる仕組み（2025年分から）。"},
// ---- 不動産 ----

/* ===== 復習スケジュール ===== */
const STEPS=[1,3,7,14,30,60]; // 箱の段階ごとの次回までの日数
/* 復習が増え続けないように「卒業」を入れる：
   ・初めて解いて「覚えた／合ってた」→ 卒業（もう復習に出さない）
   ・まちがえた → 明日 →（合ってた）→ 7日後 →（合ってた）→ 卒業
   ・あやしい → 3日後 →（合ってた）→ 7日後 →（合ってた）→ 卒業
   卒業した問題も、まちがえた記録が残っていれば試験前の「仕上げ」には出る */
const GRAD="9999-12-31";
const graduates=c=>!c||(c.b||0)>=2;   // 次に「覚えた」で卒業するか
const sureLabel=c=>graduates(c)?"卒業（もう出ません）":"7日後";
const fmt=d=>d.toISOString().slice(0,10);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return fmt(d)};
const addDays=n=>{const d=new Date(today()+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return fmt(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/864e5);

/* ===== 保存（Claudeのクラウド保存→だめならこの端末） ===== */
const LS="fp2note.v1";
let S={cards:{},kako:[],pq:{},pr:"all",pc:"",exam:"2026-12-26",log:{}};
let db=null,docRef=null,saveTimer=null,saving=false,pending=false;
function migrateGrad(){
  if(S.gradV)return;
  for(const c of Object.values(S.cards||{})){
    if(!c||!c.d)continue;
    if(c.bb&&c.bd){
      c.bb.forEach((b,i)=>{if(b!=null&&b>=2){c.bb[i]=STEPS.length-1;c.bd[i]=GRAD}});
      c.d=c.bd.reduce((m,d)=>d<m?d:m);c.b=Math.min(...c.bb.map(b=>b==null?0:b));
    }else if(c.lr==="o"&&!(c.w>0)&&(c.b||0)>=2){c.b=STEPS.length-1;c.d=GRAD}
    else if(c.lr==="o"&&(c.b||0)>=3){c.b=STEPS.length-1;c.d=GRAD}   // まちがえた後に2回以上合っている
  }
  S.gradV=1;
}
function migrate(){migrateGrad();S.cards=S.cards||{};Object.entries(S.pq||{}).forEach(([id,v])=>{if(!S.cards[id])S.cards[id]=v});(S.kako||[]).forEach(k=>{const id=`${k.y}_${k.m}_${String(k.no).padStart(2,"0")}`;if(!S.cards[id])S.cards[id]={b:k.b||0,c:0,w:k.w||1,lr:"x",d:k.d}});S.pq={};S.kako=[]}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(t){document.getElementById("sync").textContent=t}
function save(){
  saveLocal();
  if(!docRef)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,1200);
}
async function flush(){
  if(saving){pending=true;return}
  saving=true;setSync("保存中…");
  try{await docRef.set(JSON.parse(JSON.stringify(S)));setSync("クラウドに保存済み")}
  catch(e){setSync("この端末に保存")}
  saving=false;
  if(pending){pending=false;flush()}
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u)return;
    const id=await u.id(); if(!id)return;
    db=d; docRef=db.doc("data/users/"+id+"/progress");
    const snap=await docRef.get();
    if(snap.exists){
      const remote=snap.data();
      // 回答数が多い方を採用（端末とクラウドのずれ対策）
      const cnt=o=>Object.values(o.cards||{}).reduce((s,c)=>s+(c.c||0)+(c.w||0),0)+Object.values(o.pq||{}).reduce((s,c)=>s+(c.c||0)+(c.w||0),0)+(o.kako||[]).length;
      if(cnt(remote)>=cnt(S)){S=Object.assign({cards:{},kako:[],pq:{},pr:"r12",pc:"",exam:S.exam,log:{}},JSON.parse(JSON.stringify(remote)));migrate();if(!S.myClr){S.my={};S.myClr=1}if(pqState==="ok")migrateGroups();saveLocal()}
      else flush();
    }else if(Object.keys(S.cards).length||Object.keys(S.pq).length){flush()}
    setSync("クラウドに保存済み");
    render();
  }catch(e){setSync("この端末に保存")}
}

/* ===== 公式過去問（金融財政事情研究会 公表の1級学科・基礎編）を1文ずつの〇×問題にしたもの ===== */
// 学科基礎編の分野の並び（目安）：問1-8 ライフ／9-15 リスク／16-24 金融／25-33 タックス／34-41 不動産／42-50 相続
const catOf=no=>no<=10?"L":no<=20?"R":no<=30?"K":no<=40?"T":no<=50?"F":"S";
const EXAMS=[[2026,5],[2025,5],[2025,1],[2024,9],[2024,5]];
// 2025年5月・2026年5月はCBT（パソコン受験）になってから協会が公表した問題。それ以外は紙の試験の実際の問題
const isCBT=(y,m)=>y>=2025&&m===5;
const exName=(y,m)=>isCBT(y,m)?`${y}年${m}月公表（CBT）`:`${y}年${m}月`;
// オリジナルの4択問題も〇×に分ける
Q.splice(0,Q.length,...Q.flatMap(q=>q.type!=="mc"?[q]:q.ch.map((t,i)=>({id:q.id+"_"+(i+1),c:q.c,k:q.k,h:q.q+"（次の答えは正しいか）",q:"答え："+t,a:i===q.a?"o":"x",e:q.e}))));
let PQ=[],RAW=[],pqState="loading",IMG={};
/* 「答え：〇〇円」のように4つの答えから選ぶ問題（計算など）は、同じ計算を4回させないよう1問にまとめる。
   出題のたびに4つの答えのうち1つを〇×で出す（半分の確率で正しい答え）。記録は問題単位（id＝親番号_c）。 */
function pickVar(G){
  if(!G.grp)return G;
  const ok=G.grp.filter(v=>v.a==="o"),ng=G.grp.filter(v=>v.a!=="o");
  const pool=ok.length&&(Math.random()<.5||!ng.length)?ok:ng;
  const v=pool[Math.floor(Math.random()*pool.length)];
  Object.assign(G,{q:v.s,s:v.s,a:v.a,e:v.e,law:v.law,vid:v.id});
  return G;
}
function groupCalc(list){
  const by={};list.forEach(o=>(by[o.p]=by[o.p]||[]).push(o));
  const out=[],seen={};
  for(const o of list){
    const g=by[o.p];
    if(!g.every(x=>/^答え：/.test(x.s))){out.push(o);continue}
    if(seen[o.p])continue;seen[o.p]=1;
    out.push(pickVar({...g[0],id:o.p+"_c",grp:g}));
  }
  return out;
}
// 以前に1文ずつ解いた記録を、まとめた問題に引き継ぐ
function migrateGroups(){
  if(!S||!S.cards)return;
  for(const G of PQ){
    if(!G.grp)continue;
    if(!S.cards[G.id]){const cs=G.grp.map(v=>S.cards[v.id]).filter(Boolean).sort((a,b)=>(b.t||"")<(a.t||"")?-1:1);if(cs.length)S.cards[G.id]={...cs[0]}}
    if(S.pass&&G.grp.some(v=>S.pass[v.id])&&!S.pass[G.id]){S.pass[G.id]=G.grp.map(v=>S.pass[v.id]).filter(Boolean).sort()[0]}
    if(S.pass)G.grp.forEach(v=>delete S.pass[v.id]);
  }
}
async function loadImgs(){for(const f of ["imgs.json"]){try{const r=await fetch(f);if(r.ok)Object.assign(IMG,await r.json())}catch(e){}}if(session)renderQuiz()}
async function loadPast(){
  try{
    RAW=[];
    for(const f of ["past.json"]){const r=await fetch(f);if(!r.ok)throw 0;const j=await r.json();RAW.push(...j.items.map(o=>({...o,h:j.h[o.p],pt:(j.pt||{})[o.p],th:(j.tm||{})[o.p],q:o.s,c:catOf(o.no),past:true})))}
    PQ=groupCalc(RAW);migrateGroups();
    pqState="ok";
  }catch(e){pqState="error"}
  if(!session&&!lesson)render();
  loadImgs();loadOyo();
}

/* ===== 集計 ===== */
const card=id=>S.cards[id];
const isDue=id=>{const c=card(id);return c&&c.d<=today()};
// 計算問題（応用編の〔計算過程〕の問題と、基礎編の計算・資料の問題）は、毎日の流れにも復習にも入れず「計算道場」で解く
const isDojoQ=q=>!!(q&&(q.calc||(!q.oyo&&q.img)));
function dueQ(){return ALL().filter(q=>isDue(q.id)&&!isDojoQ(q))}
// 1日の復習は30問まで。間違えた問題→期限が古い順に出し、残りは翌日以降に回す（先に進む時間を確保するため）
const REVIEW_CAP=30;
function dueToday(){const pr=q=>{const c=card(q.id);return (c.lr==="x"?0:1)};return dueQ().sort((a,b)=>pr(a)-pr(b)||(card(a.id).d<card(b.id).d?-1:card(a.id).d>card(b.id).d?1:0)).slice(0,REVIEW_CAP)}
const lessonDone=q=>!q.th||!!C0().read[q.th];   // テーマの3分レッスンを読んだか（テーマのない問題は読んだ扱い）
const unmastered=q=>{const c=card(q.id);return !!c&&c.d!==GRAD&&!isDojoQ(q)};   // 解いたことがあって、まだ卒業していない
function masterySets(){
  const pr=q=>{const c=card(q.id);return (c.lr==="x"?0:1)},byDue=(a,b)=>pr(a)-pr(b)||(card(a.id).d<card(b.id).d?-1:card(a.id).d>card(b.id).d?1:0);
  const U=ALL().filter(q=>unmastered(q)&&isDue(q.id));   // 期限が来た問題だけ（期限前は、間をあけた方が覚えるので出さない）
  return {mine:U.filter(lessonDone).sort(byDue),pre:U.filter(q=>!lessonDone(q)).sort(byDue)};
}
// 30問ずつ区切って出す（区切りごとに「続き：次の30問」）。区切るたびに数え直すので、解いた問題は次の区切りに出ない
const MASTERY_CHUNK=30;
function startMastery(){
  const M=masterySets(),pre=!M.mine.length,L=pre?M.pre:M.mine;
  if(!L.length){lesson=null;render();return}
  const chunk=L.slice(0,MASTERY_CHUNK),rest=M.mine.length+M.pre.length-chunk.length;
  start(chunk,pre?"習得に専念（レッスン前のテーマ）":"習得に専念");
  if(rest>0){
    session.then=startMastery;
    const nextPre=pre||M.mine.length<=chunk.length;
    session.thenLabel=`続き：次の${Math.min(MASTERY_CHUNK,rest)}問${nextPre&&!pre?"（ここからレッスン前のテーマ）":""}（残り ${rest}問）`;
  }
}
// パスした問題（あとで調べて解く）。答えると一覧から外れる
function passQ(){const P=S.pass||{};return ALL().filter(q=>P[q.id]).sort((a,b)=>P[a.id]<P[b.id]?-1:P[a.id]>P[b.id]?1:0)}
function doPass(q){if(q.dojo){session.i++;session.answered=null;renderQuiz();window.scrollTo(0,0);return}S.pass=S.pass||{};S.pass[q.id]=S.pass[q.id]||today();save();session.passed=(session.passed||0)+1;session.i++;session.answered=null;renderQuiz();window.scrollTo(0,0)}
function statFor(list){
  let m=0,l=0,w=0;
  list.forEach(q=>{const c=card(q.id);if(!c)return;if(c.lr==="x")w++;else if(c.b>=3)m++;else l++});
  return {m,l,w,n:list.length,untouched:list.length-m-l-w};
}
function streak(){let n=0;for(let i=0;;i++){const d=addDays(-i);if(S.log[d])n++;else if(i>0)break;else continue;}return n}

}

/* ===== 専門用語の辞書（タップで意味を表示） ===== */
const THEMES=[{"id":"A03","f":"A","n":"公的医療保険（健康保険・国保・後期高齢者）","b":["会社員は健康保険、自営業者は国民健康保険、75歳以上は全員が後期高齢者医療制度に入る。","病院での自己負担は原則3割。70〜74歳は2割（現役並み所得は3割）、75歳以上は1割（一定の所得で2割、現役並みは3割）。","高額療養費：1カ月の自己負担が上限を超えたら戻ってくる。上限は所得で決まり、食事代・差額ベッド代は対象外。","傷病手当金：病気で休んで4日目から、給料の3分の2を通算1年6カ月。国民健康保険には原則ない。","退職後は「任意継続（最長2年・保険料は全額自分）」「国保」「家族の扶養」から選ぶ。任意継続は退職日の翌日から20日以内に申出。","退職日まで1年以上加入していれば、もらっていた傷病手当金・出産手当金は退職後も続く。"],"c":"「3日待って4日目から、3分の2を1年半」＝傷病手当金"},{"id":"A05","f":"A","n":"労災保険","b":["会社に雇われている人は、パート・アルバイト・日雇いも全員が対象。保険料は会社が全額負担。","仕事中のけが（業務災害）と通勤中のけが（通勤災害）が対象。通勤の寄り道中は対象外だが、日用品の買い物などの後に経路に戻れば対象。","休業補償は休んで4日目から、給料（給付基礎日額）の60％＋特別支給金20％＝80％。最初の3日間は会社が60％を補償。","1年6カ月たっても治らず、傷病等級1〜3級なら休業補償に代わって傷病補償年金。","障害が残ったら、1〜7級は年金、8〜14級は一時金。","社長や個人事業主は原則対象外だが、特別加入できる（特別加入者に通勤災害がない場合もある）。"],"c":"「労災は4日目から60＋20＝80％」"},{"id":"A06","f":"A","n":"基本手当（雇用保険）","b":["基本手当（いわゆる失業手当）は、原則として離職前2年間に被保険者期間が12カ月以上あればもらえる。倒産・解雇なら離職前1年間に6カ月以上でよい。","待期は7日間。自己都合で辞めた場合は、さらに給付制限（原則1カ月）がある。","所定給付日数：自己都合・定年は加入10年未満90日、10年以上120日、20年以上150日。倒産・解雇は年齢と期間で最大330日。","受給期間は原則離職の翌日から1年。病気・出産・育児で30日以上働けないなら最長3年延ばせる（合計最長4年）。","65歳以上で辞めたら基本手当ではなく高年齢求職者給付金（一時金：加入1年以上で50日分、1年未満で30日分）。","基本手当などの雇用保険の給付は非課税。"],"c":"「自己都合は90・120・150」"},{"id":"A07","f":"A","n":"育児・介護・高年齢の給付（雇用保険）","b":["育児休業給付：休業開始から180日は賃金の67％、その後50％。原則1歳まで、保育所に入れなければ最長2歳まで。","産後パパ育休（出生時育児休業）：子の出生後8週間以内に最大4週間（28日）、2回に分けて取れる。","出生後休業支援給付（2025年4月〜）：両親がそれぞれ14日以上休むと、最大28日分、賃金の13％が上乗せ（合計で手取り10割相当）。","介護休業給付：対象家族1人につき通算93日まで、3回まで分割でき、賃金の67％。","高年齢雇用継続給付：60歳以降の賃金が60歳時点の75％未満に下がったら支給。支給率は最大10％（2025年4月から）。","教育訓練給付：一般は費用の20％（上限10万円）、特定一般は40％〜50％、専門実践は最大80％。2025年10月から教育訓練休暇給付金もできた。"],"c":"「育休は67→50、介護は93日・67％」"},{"id":"A08","f":"A","n":"公的年金のしくみと保険料","b":["国民年金は20歳以上60歳未満の全員。第1号＝自営業者・学生、第2号＝会社員・公務員、第3号＝第2号に扶養される配偶者。","国民年金保険料は定額。免除・猶予・学生納付特例を受けた期間は、10年以内なら追納できる。産前産後に加え、2026年10月から第1号の育児期間（子が1歳まで）も保険料が免除。","厚生年金保険料は標準報酬月額×18.3％を会社と本人で半分ずつ。標準報酬月額は4〜6月の平均で決め、9月から使う（定時決定）。上限は65万円、賞与は1回150万円まで。","合算対象期間（カラ期間）は、受給資格の10年には数えるが年金額には入らない期間（会社員の20歳前・60歳以後など）。","離婚時の年金分割：合意分割は最大2分の1、3号分割は2008年4月以後の第3号期間を自動で2分の1。請求期限は離婚から5年（2026年4月から延長）。","年金は原則1人1年金。65歳以降は「老齢基礎＋遺族厚生」など一部の組合せができる。公的年金等は雑所得で、公的年金等控除がある。"],"c":"「1号自営・2号会社員・3号その配偶者」"},{"id":"A09","f":"A","n":"老齢年金（繰上げ・繰下げ・在職老齢）","b":["老齢基礎年金は10年以上の資格期間で65歳から。満額は480月（40年）納付で、2026年度は年847,300円（1956年4月2日以後生まれ）。","年金額＝満額×（保険料納付月数＋免除月数×一定割合）÷480。全額免除の期間は2009年4月以後なら2分の1で計算。","老齢厚生年金（報酬比例部分）＝平均標準報酬額×5.481/1000×2003年4月以後の月数（それより前は7.125/1000）。","繰上げは1カ月0.4％減（1962年4月2日以後生まれ）、繰下げは1カ月0.7％増で75歳まで（最大84％増）。繰上げは基礎と厚生を同時、繰下げは別々にできる。","在職老齢年金：給料（総報酬月額相当額）＋年金（基本月額）が基準額（2026年度は65万円）を超えたら、超えた分の2分の1が止まる。老齢基礎年金は止まらない。","加給年金：厚生年金20年以上で、65歳未満の配偶者を扶養していれば加算。配偶者が65歳になると終わり、配偶者の振替加算に切り替わる。"],"c":"「早く0.4減、遅く0.7増、最大84」"},{"id":"A10","f":"A","n":"障害年金","b":["初診日に国民年金なら障害基礎年金（1・2級）、厚生年金なら障害厚生年金（1・2・3級＋障害手当金）。","保険料の納付要件：初診日の前々月までの加入期間の3分の2以上が納付・免除済み（または直近1年に未納なし）。","障害認定日は初診日から1年6カ月後（それまでに治ればその日）。","1級は2級の1.25倍。障害基礎年金は子の加算、障害厚生年金（1・2級）は配偶者の加給年金。","障害厚生年金の加入期間が300月未満なら300月とみなす。3級には最低保障額がある。","20歳前に初診日がある障害基礎年金は、保険料を払っていなくても20歳から出る（所得制限あり）。"],"c":"「初診日で決まる、3分の2納付、1年半で認定」"},{"id":"A11","f":"A","n":"遺族年金","b":["遺族基礎年金：子のある配偶者または子が対象（子は18歳到達年度末まで、障害があれば20歳まで）。","遺族厚生年金：亡くなった人の老齢厚生年金（報酬比例部分）の4分の3。順位は配偶者・子→父母→孫→祖父母（兄弟姉妹は入らない）。","夫・父母・祖父母は55歳以上が条件で、支給は60歳から。","子のない30歳未満の妻の遺族厚生年金は5年で終わる。","中高齢寡婦加算：子のない妻などが40〜65歳の間にもらえる上乗せ。","自営業者の遺族向け独自給付：寡婦年金（妻が60〜65歳、夫の基礎年金の4分の3）と死亡一時金（3年以上納付）。どちらか一方を選ぶ。"],"c":"「遺族厚生は4分の3」"},{"id":"A12","f":"A","n":"企業年金・iDeCo・自営業者の上乗せ","b":["確定拠出年金（DC）は掛金を自分で運用し、結果で受取額が変わる。確定給付企業年金（DB）は受取額があらかじめ決まっている。","iDeCoの掛金は月5,000円以上・1,000円単位。上限は加入者の種類で違い、自営業者は国民年金基金と合計で月6万8,000円。","DCの掛金は全額所得控除（小規模企業共済等掛金控除）。受け取るときは一時金なら退職所得、年金なら雑所得。","DCは原則60歳まで引き出せない。受取開始年齢は60歳時点の加入期間で決まる（10年以上なら60歳から）。","小規模企業共済：個人事業主・小さい会社の役員の退職金。掛金は月1,000〜70,000円で全額所得控除。","中小企業退職金共済（中退共）：会社が従業員のために掛ける退職金。掛金は月5,000〜30,000円で全額損金、役員は入れない。"],"c":"「自営業者の上限は月6.8万円（iDeCo＋基金）」"},{"id":"A01","f":"A","n":"FPの仕事と関連法規","b":["資格がないとできないのは、その資格の中心業務を、他人のために、仕事として行うこと。","税理士：個別の税務相談・税務書類の作成・税務代理は、無償でもダメ。一般的な税の説明はOK。","弁護士：具体的な法律判断・紛争の代理はダメ。一般的な法律の説明や、公正証書遺言の証人はOK。","社会保険労務士：社会保険の書類作成・提出代行はダメ。年金額の試算や制度の説明はOK。","保険の募集は登録が必要。投資助言は金融商品取引業の登録が必要（一般的な情報提供はOK）。","官公庁の資料は転載禁止の表示がなければ出典を明記して使える。顧客情報の守秘義務を守る。"],"c":"「一般論はOK、個別具体はNG」"},{"id":"A02","f":"A","n":"6つの係数と資金計画","b":["終価係数：今の元本が将来いくらになるか。現価係数：将来の目標額のために今いくら必要か。","年金終価係数：毎年積み立てたら将来いくら。減債基金係数：将来の目標額のために毎年いくら積み立てるか。","資本回収係数：今の元本から毎年いくら取り崩せるか。年金現価係数：毎年いくら受け取るために今いくら必要か。","よく出る型：「65歳から毎年〇円受け取るには？」→受取額×年金現価係数で65歳時点の必要額→それ×減債基金係数で毎年の積立額。","物価上昇があるときは、今の金額×終価係数（物価上昇率）で将来の金額に直してから計算する。","取り崩し中と積立中で利率が違うときは、それぞれの利率の係数を使う。"],"c":"「貯めるは減債、崩すは資本回収、必要額は現価」"},{"id":"A13","f":"A","n":"住宅ローン・フラット35","b":["フラット35は住宅金融支援機構と民間金融機関の全期間固定金利の住宅ローン。融資は1人1億2,000万円まで（2026年改正）で、建設費・購入価額の100％まで。","対象は本人や親族が住む家。投資用は不可。中古マンションは床面積30㎡以上、一戸建ては70㎡以上。","返済負担率：年収400万円未満は30％以下、400万円以上は35％以下。","繰上げ返済は窓口なら100万円以上（インターネットなら10万円以上）、手数料なし。","フラット35Sは省エネなどの性能が高い家で当初金利が下がる。リ・バース60は60歳以上向けで、生きている間は利息だけ払い、亡くなったら家を売って返す。","返済方法：元利均等は毎回の返済額が同じ、元金均等は最初の返済が多いが総返済額は少ない。"],"c":"「フラットは全期間固定、リ・バースは利息だけ」"},{"id":"A14","f":"A","n":"教育資金と奨学金","b":["国の教育ローン（日本政策金融公庫）：学生1人350万円まで（海外留学などは450万円）、返済は最長20年。世帯年収の上限あり。","入学金・授業料だけでなく、受験料・受験時の交通費・宿泊費・住居費にも使える。","日本学生支援機構の奨学金：第一種は無利子、第二種は有利子（固定か見直しを選ぶ）。給付型奨学金は返さなくてよい。","児童手当：2024年10月から所得制限なし、高校生年代まで、第3子以降は月3万円。","こども保険（学資保険）は契約者が亡くなると以後の保険料が免除される。","教育資金の一括贈与の非課税（1,500万円）は2026年3月で新規受付が終わった。"],"c":"「国の教育ローンは350万円・最長20年」"},{"id":"A15","f":"A","n":"中小企業の資金調達と財務","b":["直接金融（株式・社債）と間接金融（銀行借入）がある。ファクタリングは売掛金を売ってお金にする（借入れではない）。","信用保証協会の保証付き融資：中小企業の借入れを協会が保証する。セーフティネット保証は市区町村長の認定が必要。","日本政策金融公庫のマル経融資は無担保・無保証人。経営セーフティ共済は取引先が倒産したとき掛金の10倍（最高8,000万円）まで借りられる。","キャッシュフロー計算書：営業CF（本業）、投資CF（設備・有価証券の売買）、財務CF（借入れ・返済・増資・配当）。","損益分岐点売上高＝固定費÷（1－変動費率）。経営安全率＝（売上高－損益分岐点売上高）÷売上高。","募集株式の発行：公開会社は取締役会、非公開会社は株主総会の特別決議で決める。"],"c":"「損益分岐点＝固定費÷限界利益率」"},{"id":"B02","f":"B","n":"生命保険の商品と手続き","b":["定期保険は期間中の死亡だけ保障（掛け捨て）、終身保険は一生保障、養老保険は死亡でも満期でも同じ額。","収入保障保険は死亡後に年金で受け取り、時間とともに受取総額が減る。逓減定期は保険金が減り、逓増定期は増える。","払済保険：保険料をやめて、そのときの解約返戻金で保障を小さくして続ける。延長保険：保障額はそのままで期間を短くする。どちらも予定利率は元のまま。","契約転換：今の保険を下取りして新しい保険に入る。転換時の年齢・保険料率で、告知や診査が必要。","契約者貸付は解約返戻金の一定範囲まで。自動振替貸付は保険料が払えないとき自動で立て替える。","リビング・ニーズ特約は余命6カ月で死亡保険金を前払い。指定代理請求特約は本人が請求できないとき家族が請求できる。"],"c":"「払済は小さく続ける、延長は短く続ける」"},{"id":"B03","f":"B","n":"第三分野の保険（医療・がん・介護・就業不能）","b":["第三分野は生命保険（第一分野）と損害保険（第二分野）の中間で、医療・がん・介護・所得補償など。","医療保険は入院・手術で給付。人間ドックで見つかった病気の治療のための入院は対象（検査だけの入院は対象外）。","がん保険は契約から90日（3カ月）の免責期間がある。","先進医療特約は、療養を受けた時点で先進医療に当たるかで判定する。","所得補償保険・就業不能保険は病気やけがで働けないときの収入を補う（失業は対象外）。所得補償保険の保険金は非課税。","介護保険（民間）は女性のほうが保険料が高い。認知症保険は掛け捨てが一般的。"],"c":"「がん保険は90日待つ」"},{"id":"B04","f":"B","n":"保険と税金（個人・個人事業主）","b":["死亡保険金の税金は「誰が保険料を払い、誰が受け取るか」で決まる。払った人＝亡くなった人なら相続税、払った人＝受取人なら所得税（一時所得）、それ以外は贈与税。","満期保険金・解約返戻金は、払った人＝受取人なら一時所得（50万円控除後の2分の1）。一時払養老保険などを5年以内に解約すると金融類似商品で20.315％の源泉分離。","個人年金保険の年金は雑所得（年金額－保険料）。年25万円以上なら10.21％源泉徴収。","生命保険料控除：2012年以降の契約は一般・介護医療・個人年金で各4万円、合計12万円（住民税は各2.8万円・合計7万円）。2026・2027年分は23歳未満の扶養親族がいれば一般が6万円に。","地震保険料控除：所得税最高5万円、住民税最高2.5万円。自宅と家財が対象（貸家・別荘は対象外）。","入院給付金・手術給付金・所得補償保険金・車両保険金・損害賠償金は非課税。個人事業主の店舗休業保険金や商品の火災保険金は事業収入。"],"c":"「払った人と受け取る人で税金が決まる」"},{"id":"B05","f":"B","n":"法人の保険（経理処理）","b":["定期保険・第三分野は最高解約返戻率で処理が変わる（2019年7月8日以後の契約）。50％以下は全額損金。","50％超70％以下：最初の4割の期間は保険料の4割を資産、6割を損金。70％超85％以下：最初の4割の期間は6割を資産、4割を損金。85％超は返戻率に応じて多くを資産計上。","養老保険のハーフタックスプラン：満期は法人、死亡は従業員の遺族が受取人で、全員加入なら保険料の2分の1が福利厚生費、2分の1が資産。","終身保険（法人が受取人）は保険料の全額が資産計上。","解約や払済への変更をしたら、資産計上していた額を取り崩し、解約返戻金との差額を雑収入（雑損失）にする。","役員だけを被保険者にして遺族を受取人にすると、保険料はその役員の給与になる。"],"c":"「50・70・85で区切る」"},{"id":"B06","f":"B","n":"損害保険の商品（火災・地震・自動車・傷害）","b":["火災保険は火事だけでなく落雷・風災・水災なども補償（契約による）。保険期間は最長5年。","地震保険は火災保険とセットでだけ入れる。保険金額は火災保険の30〜50％（建物5,000万円・家財1,000万円まで）。損害は全損100％・大半損60％・小半損30％・一部損5％。","地震保険料は建物の構造と都道府県で決まる。免震建築物割引は50％、耐震等級割引は等級に応じて最大50％（重複不可）。","自賠責保険は強制加入で対人賠償だけ。死亡3,000万円・傷害120万円・後遺障害75万〜4,000万円。","任意の自動車保険：対人・対物賠償は家族（配偶者・父母・子）への損害は対象外。人身傷害は過失に関係なく自分のけがを補償。","等級：対人・対物・車両の事故は3等級ダウン、盗難・台風・飛び石は1等級ダウン、人身傷害だけならノーカウント。"],"c":"「地震保険は火災保険の30〜50％、5,000万・1,000万まで」"},{"id":"B07","f":"B","n":"事業活動の損害保険","b":["施設所有（管理）者賠償責任保険：店や業務中の事故（看板の落下、配膳中にこぼした、配達中など）。","生産物賠償責任保険（PL保険）：売った商品や引き渡した仕事の結果で起きた事故（弁当の食中毒、工事完了後の事故）。","請負業者賠償責任保険：工事中の事故で他人にけがをさせたとき。建設工事保険は工事中の建物そのものの損害。","受託者賠償責任保険：預かった物を壊したとき。","労働災害総合保険：労災の上乗せ（法定外補償）と、会社の損害賠償（使用者賠償）の2つ。","会社役員賠償責任保険（D&O）：役員が損害賠償請求を受けたときの損害。罰金・課徴金は対象外。"],"c":"「施設・作業中は施設賠償、渡した後はPL」"},{"id":"B01","f":"B","n":"保険の法律と契約者保護","b":["クーリング・オフ：申込日か書面を受け取った日の遅いほうから8日以内に書面か電磁的方法で。保険期間1年以下、医師の診査後、法人契約はできない。","保険契約者保護機構：生命保険は責任準備金等の90％まで補償。損害保険の自動車・火災などは破綻後3カ月は全額、その後80％。共済と少額短期保険は対象外。","保険法：他人を被保険者にする死亡保険は本人の同意が必要。告知義務は聞かれたことに答える義務。告知違反の解除は知ってから1カ月・契約から5年。","保険金の請求権は3年で時効。遺言で受取人を変えたら相続人が保険会社に通知しないと対抗できない。","保険会社の健全性：ソルベンシー・マージン比率200％以上が目安（2026年3月期から経済価値ベースのESRへ）。基礎利益は本業のもうけ。","少額短期保険は保険期間が短く（生保1年・損保2年まで）、生命保険料控除の対象外。"],"c":"「8日以内、90％補償」"},{"id":"D01","f":"D","n":"所得税のしくみと申告","b":["所得税は1月1日〜12月31日の所得に課税。10種類の所得に分けて計算し、翌年2月16日〜3月15日に確定申告。","居住者は国内外すべての所得、非永住者は国外所得のうち国内払い・送金分も、非居住者は国内源泉所得だけ。","非課税：通勤手当（電車は月15万円まで）、雇用保険・健康保険の給付、損害賠償金、障害者等の少額預金の利子など。","会社員でも、給与収入2,000万円超、給与以外の所得20万円超、2カ所以上から給与などは確定申告が必要。","青色申告：事前に申請。最大65万円の控除（e-Taxなど）、純損失の3年繰越し、専従者給与などの特典。","納付は3月15日まで。半分以上払えば残りは5月31日まで延納できる。予定納税は7月と11月。"],"c":"「10種類に分けて合わせる」"},{"id":"D03","f":"D","n":"給与・退職・利子・配当・一時・雑所得","b":["給与所得＝収入－給与所得控除。収入850万円超で子育てなどの条件があれば所得金額調整控除（最大15万円）。","退職所得＝（収入－退職所得控除）×2分の1。控除は勤続20年まで1年40万円、20年超は1年70万円（障害退職は100万円加算）。役員等で勤続5年以下は2分の1にしない。","利子所得は原則20.315％の源泉分離。配当所得は総合課税（配当控除あり）・申告分離・申告不要から選べる。","一時所得＝収入－支出－50万円。総所得に入れるのはその2分の1。生命保険の満期金、懸賞の賞金、ふるさと納税の返礼品など。","雑所得：公的年金等（公的年金等控除あり）、副業、暗号資産など。雑所得の赤字は他の所得と通算できない。","退職金は「退職所得の受給に関する申告書」を出せば源泉徴収で終わり、確定申告はいらない。"],"c":"「退職は20年で40万→70万」"},{"id":"D05","f":"D","n":"損益通算と繰越控除","b":["損益通算できる赤字は「不動産・事業・山林・譲渡」の4つだけ（ふ・じ・さん・じょう）。","通算できない赤字：不動産所得のうち土地を買うための借入金利子分、ぜいたく品（金地金・ゴルフ会員権など）の譲渡損、一時所得・雑所得の赤字。","通算の順番：経常所得（不動産・事業・給与・雑など）の中で→譲渡・一時の中で→互いに→山林→退職。","一時所得と通算するときは2分の1する前の金額で。","青色申告なら純損失を3年繰り越せる。雑損失は白色でも3年（災害は5年の場合あり）。","上場株式の譲渡損は株式の中だけで通算し、3年繰越し。"],"c":"「ふ・じ・さん・じょう」"},{"id":"D06","f":"D","n":"所得控除","b":["基礎控除は合計所得で変わり、2,500万円超はゼロ。配偶者控除・配偶者特別控除は本人の合計所得1,000万円超なら使えない。","扶養控除：一般38万円、19〜22歳の特定扶養63万円、70歳以上は48万円（同居の親などは58万円）。16歳未満は対象外。","医療費控除：医療費－10万円（所得200万円未満は所得の5％）、上限200万円。セルフメディケーション税制は市販薬－1.2万円（上限8.8万円）でどちらか一方。","社会保険料控除は家族の分を払っても自分の控除になる。小規模企業共済・iDeCoの掛金は全額控除。","雑損控除：災害・盗難・横領が対象（詐欺・紛失は対象外）。損失－所得の10％か、災害関連支出－5万円の多いほう。","寡婦控除27万円・ひとり親控除35万円（本人の所得500万円以下）。障害者控除27万円、特別障害者40万円、同居特別障害者75万円。"],"c":"「医療費は10万円か所得の5％」"},{"id":"D07","f":"D","n":"税額控除（住宅ローン控除など）","b":["住宅ローン控除（新築）：年末ローン残高×0.7％、最長13年、合計所得2,000万円以下。床面積50㎡以上（40〜50㎡は所得1,000万円以下）。","限度額は家の性能で違う（認定長期優良住宅・ZEHなどが高い）。省エネ基準を満たさない新築は2024年以降入居なら原則対象外。","住宅の半分以上を自分が住む部分にしていること、引渡しから6カ月以内に住むことが条件。初年度は確定申告、2年目から年末調整。","配当控除：総合課税を選んだ配当だけ。課税総所得1,000万円以下の部分は10％、超える部分は5％。","耐震改修・バリアフリー改修・省エネ改修には工事費の10％の税額控除がある。","外国税額控除は外国で引かれた税金と二重にならないように差し引く。"],"c":"「0.7％を13年」"},{"id":"D09","f":"D","n":"法人税の益金・損金（減価償却・交際費）","b":["法人の所得＝益金－損金。会計の利益に「加算（益金算入・損金不算入）」と「減算（益金不算入・損金算入）」をして計算する（別表四）。","受取配当等の益金不算入：完全子法人・関連法人（3分の1超）は100％（関連法人は負債利子を控除）、その他は50％、非支配目的（5％以下）は20％。","交際費：中小法人は年800万円まで全額損金か、接待飲食費の50％損金の有利なほう。大法人は接待飲食費の50％だけ。1人1万円以下の飲食は交際費にならない。","減価償却：10万円未満は全額損金、20万円未満は3年で均等償却、中小企業者は30万円未満（2026年4月以後は40万円未満・従業員400人以下）を即時償却（年300万円まで）。","寄附金：国・自治体への寄附と指定寄附金は全額損金、一般の寄附金は限度額まで。100％グループ内は出す側は損金にならず、受ける側も益金にならない。","貸倒損失・資産の評価損は厳しい条件のときだけ損金。修繕費か資本的支出かは20万円未満・3年周期・60万円未満などで判定。"],"c":"「中小法人の交際費は800万円」"},{"id":"D10","f":"D","n":"役員給与と会社・役員の取引（法人税）","b":["損金になる役員給与は3つ：定期同額給与、事前確定届出給与、業績連動給与。","定期同額給与の改定は期首から3カ月以内なら損金。それ以外の時期に増額すると増額分は損金不算入。","事前確定届出給与は届け出た金額とぴったり同じに払わないと、全額が損金不算入。","役員退職金は不相当に高くなければ損金（届出不要）。","会社が役員に安く売る→時価との差額は役員給与。役員が会社に高く売る→時価を超える部分は役員給与。","役員が会社に安く売る→会社は時価との差額が受贈益。時価の2分の1未満なら役員は時価で売ったとみなされる。"],"c":"「時価との差を見る」"},{"id":"D11","f":"D","n":"法人税の計算・申告と特例","b":["法人税率は23.2％。中小法人は所得800万円以下の部分が15％（所得10億円超の年は17％）。","確定申告は事業年度終了の翌日から2カ月以内。中間申告は事業年度開始から6カ月経過後2カ月以内。資本金1億円超はe-Tax義務。","青色申告の欠損金は10年（2018年4月以後の分）繰り越せる。中小法人は所得の全額まで、大法人は50％まで。","会社設立：設立届出は2カ月以内、青色申告の申請は3カ月以内（と第1期末の早いほう）。","賃上げ促進税制（中小企業）：給与総額が1.5％以上増えたら増加額の15％、2.5％以上で30％を税額控除（上乗せで最大45％）。","中小企業投資促進税制：機械などに30％の特別償却か7％の税額控除（税額控除は資本金3,000万円以下）。"],"c":"「中小法人は800万円まで15％」"},{"id":"D13","f":"D","n":"消費税","b":["消費税は国内で事業者が対価を得て行う取引にかかる。土地の売買・住宅の家賃・利子・保険料・医療・学校の授業料などは非課税。","基準期間（2年前）の課税売上高が1,000万円以下なら免税事業者。ただし特定期間（前年の前半）の売上・給与が1,000万円超なら課税。設立時の資本金1,000万円以上も課税。","簡易課税：基準期間の課税売上高5,000万円以下で選べる。届出は使う年の前日まで、2年間は続ける。還付は受けられない。","みなし仕入率：卸売90％、小売80％、製造70％、その他60％、サービス50％、不動産40％。","インボイス制度：仕入税額控除にはインボイスの保存が必要。登録すると売上1,000万円以下でも課税事業者。","役員への無償の贈与や個人事業主の家事消費は、売ったとみなして課税（みなし譲渡）。"],"c":"「2年前で1,000万円・簡易は5,000万円」"},{"id":"C01","f":"C","n":"経済指標と金融政策","b":["GDPは国内で生まれた付加価値。支出面では個人消費が約5〜6割。実質GDPは物価変動を除いたもの。GDPデフレーター＝名目÷実質。","景気動向指数：CIは景気の強さ（量感）、DIは景気の広がり（50％超で拡張）。","先行系列：新規求人数・新設住宅着工床面積・東証株価指数・マネーストック（M2）など。一致系列：有効求人倍率・鉱工業生産指数など。遅行系列：完全失業率・家計消費支出・法人税収入など。","日銀短観は年4回の企業アンケート。業況判断DI＝「良い」－「悪い」。","消費者物価指数（CPI）は総務省、企業物価指数は日銀が公表。","日銀の金融政策決定会合は年8回。米国はFOMC（年8回）。米国の雇用統計・CPIは労働省が公表。"],"c":"「失業率は遅行、求人倍率は一致」"},{"id":"C02","f":"C","n":"預金・信託・金などの商品","b":["預金：決済用預金（無利息・要求払い・決済サービス）は預金保険で全額保護。","金投資：金地金の売却益は譲渡所得（総合課税、5年超保有なら2分の1）。純金積立も同じ。金ETFは上場株と同じ扱い。","後見制度支援信託は法定後見だけ（任意後見は対象外）、財産は金銭だけ。","遺言代用信託：生前は自分、死後は指定した人が受益者になる信託。","特定贈与信託：障害者のための信託で、特別障害者6,000万円・その他の特定障害者3,000万円まで贈与税が非課税。","るいとう（株式累積投資）は月1万円以上100万円未満の積立。"],"c":"「決済用預金は全額保護」"},{"id":"C03","f":"C","n":"債券","b":["金利が上がると債券価格は下がり、金利が下がると価格は上がる。","最終利回り（単利）＝｛表面利率＋（償還価格－買値）÷残存年数｝÷買値×100。直接利回り＝表面利率÷買値×100。","割引債の利回り（複利）＝（償還価格÷買値）の残存年数乗根－1。","デュレーションは残存期間が長く、表面利率が低いほど長い（金利変動の影響を受けやすい）。割引債は残存期間と同じ。","個人向け国債：1万円から、変動10年・固定5年・固定3年。最低金利0.05％。発行から1年たてば中途換金でき、直前2回分の利子（税引前）相当額が引かれる。","格付けBBB以上が投資適格、BB以下は投機的格付け。順イールドは長期金利が高い右上がり。"],"c":"「金利と債券価格はシーソー」"},{"id":"C04","f":"C","n":"株式","b":["PER＝株価÷1株当たり純利益、PBR＝株価÷1株当たり純資産、ROE＝純利益÷自己資本。ROE＝PBR÷PER。","配当利回り＝1株当たり配当÷株価、配当性向＝配当÷純利益。サスティナブル成長率＝ROE×（1－配当性向）。","配当割引モデル（定率成長）：株価＝配当÷（期待利子率－成長率）。","東証はプライム・スタンダード・グロースの3市場。売買単位は100株。取引時間は後場15時30分まで。","日経平均は株価平均型、TOPIXは浮動株時価総額加重型。","信用取引：委託保証金は約定代金の30％以上かつ30万円以上。制度信用は返済期限6カ月。"],"c":"「ROE＝PBR÷PER」"},{"id":"C05","f":"C","n":"投資信託・ETF・REIT","b":["投資信託の関係者：委託者（運用会社）が運用を指図、受託者（信託銀行）が財産を保管、販売会社が販売。","基準価額はその日の取引終了後に計算される（ブラインド方式）。","費用：購入時手数料（ノーロードもある）、信託報酬（保有中ずっと）、信託財産留保額（解約時、ない投信もある）。","ETFは上場していて株と同じように売買できる。レバレッジ型は日々の値動きの2倍などを目指す（長期では2倍にならない）。","J-REITは不動産投資信託。分配金は配当所得だが配当控除はない。","交付目論見書は購入前に必ず渡す。運用報告書は決算ごと（決算期間6カ月未満なら6カ月ごと）。"],"c":"「委託者が指図、受託者が保管」"},{"id":"C08","f":"C","n":"金融商品の税金とNISA","b":["上場株式・株式投信の配当と譲渡益は20.315％。預金・特定公社債の利子も20.315％。","投資信託の分配金：分配落ち後の基準価額が個別元本を下回った部分は元本払戻金（非課税）、残りは普通分配金（課税）。","特定口座の源泉徴収ありなら申告不要にできる。申告するかは口座ごとに選べる。","新NISA：つみたて投資枠年120万円＋成長投資枠年240万円、生涯1,800万円（うち成長枠1,200万円）。売った分の枠は翌年に復活（簿価で管理）。","NISAで損が出ても、ほかの口座の利益と通算できない（なかったことになる）。","上場株の配当をNISAで非課税にするには株式数比例配分方式を選ぶ。"],"c":"「NISAは120＋240、生涯1,800」"},{"id":"C06","f":"C","n":"外貨建て商品","b":["円を外貨にするときはTTS（銀行が売るレート）、外貨を円にするときはTTB（銀行が買うレート）。","外貨預金の利回り：預けるときTTS、戻すときTTBで計算。円安になれば得、円高になれば損。","外貨預金は預金保険の対象外。為替予約なしの為替差益は雑所得（総合課税）。","外貨建MMFの分配金は利子所得、為替差益を含む譲渡益は上場株式等の譲渡所得（申告分離）。","外国債券の利子は20.315％の申告分離（特定公社債）。","購買力平価：同じ物は同じ値段になるという考えで為替を説明する。"],"c":"「買うTTS、戻すTTB」"},{"id":"C10","f":"C","n":"先物・オプション","b":["先物は将来の売買の価格を今決める取引。値下がりが心配なら先物を売る、値上がりが心配なら先物を買う。","日経225先物：大阪取引所、ラージは1,000倍、ミニは100倍。取引最終日はSQ日（第2金曜日）の前営業日。","オプション：コールは買う権利、プットは売る権利。買い手の損失はプレミアム（オプション料）まで、売り手の損失は無限になりうる。","値下がりに備えるならプットの買い、値上がりに備えるならコールの買い。","オプション料は、値動き（ボラティリティ）が大きいほど、満期までが長いほど高い。","アメリカンタイプはいつでも、ヨーロピアンタイプは満期日だけ権利行使できる。日経225オプションはヨーロピアン。"],"c":"「下が心配ならプット買い」"},{"id":"C11","f":"C","n":"企業の財務分析（ROE・安全性の指標）","b":["ROE（自己資本利益率）＝当期純利益÷自己資本×100。株主のお金でどれだけ利益を出したか。","ROEは3つに分けられる：売上高当期純利益率×総資産回転率×財務レバレッジ（総資産÷自己資本）。","ROA（総資産利益率）＝利益÷総資産。総資産回転率＝売上高÷総資産（単位は回）。","安全性：流動比率＝流動資産÷流動負債、当座比率＝当座資産÷流動負債、固定比率＝固定資産÷自己資本、自己資本比率＝自己資本÷総資産。","インタレスト・カバレッジ・レシオ＝（営業利益＋受取利息＋受取配当金）÷支払利息（単位は倍）。","配当性向＝配当金総額÷当期純利益、配当利回り＝1株配当÷株価、PER＝株価÷EPS、PBR＝株価÷BPS。"],"c":"「ROE＝利益率×回転率×レバレッジ」"},{"id":"C07","f":"C","n":"ポートフォリオ理論と投資の考え方","b":["分散投資で減らせるのは非市場リスク（個別リスク）。市場リスク（システマティック・リスク）は消せない。","2資産の標準偏差：√（Aの割合²×Aの分散＋Bの割合²×Bの分散＋2×Aの割合×Bの割合×共分散）。共分散＝相関係数×Aの標準偏差×Bの標準偏差。","相関係数は－1〜＋1。小さいほど分散の効果が大きい。","シャープ・レシオ＝（収益率－安全資産利子率）÷標準偏差。トレイナーの測度は÷β。インフォメーション・レシオは超過収益÷トラッキングエラー。","CAPM：期待収益率＝安全資産利子率＋β×（市場の期待収益率－安全資産利子率）。ジェンセンのアルファ＝実際の収益率－CAPMの期待収益率。","時間加重収益率は資金の出し入れの影響を除いた運用成績（運用者の評価に使う）。"],"c":"「割る数で見分ける：標準偏差・β・トラッキングエラー」"},{"id":"C09","f":"C","n":"金融の法律とセーフティネット","b":["預金保険：1金融機関・1人あたり元本1,000万円とその利息まで。決済用預金は全額。外貨預金は対象外。","日本投資者保護基金：証券会社が破綻して預けた資産が返らないとき、1人1,000万円まで。銀行で買った投資信託は対象外（銀行が分別管理）。","金融サービス提供法：重要事項の説明をしなかったら、業者は損害賠償責任を負う（元本欠損額を損害額と推定）。","消費者契約法：うそや不安をあおる勧誘で結んだ契約は取り消せる（知ってから1年・契約から5年）。","金融商品取引法：適合性の原則（顧客に合わない商品を勧めない）。インサイダー取引は未公表の重要事実を知って売買すること。","預金者保護法：偽造カードは重過失がなければ全額、盗難カードは過失なしで全額・軽過失で75％補償。"],"c":"「預金も証券も1,000万円まで」"},{"id":"E01","f":"E","n":"不動産の登記と調査","b":["登記記録は表題部（場所・広さ）と権利部。権利部の甲区は所有権、乙区は抵当権など所有権以外。","登記には対抗力（先に登記した人が勝つ）はあるが公信力はない（登記を信じても保護されるとは限らない）。","仮登記は本登記の順番を確保するだけで、対抗力はない。","相続登記は相続を知ってから3年以内が義務（2024年4月〜）。住所・氏名の変更登記は2年以内が義務（2026年4月〜）。","建物の床面積は壁の中心線で測る。マンションの部屋は内側線で測る。","登記事項証明書は誰でも取れる。14条地図は精度が高く、公図は位置の参考程度。"],"c":"「甲は所有権、乙はそれ以外」"},{"id":"E02","f":"E","n":"不動産の価格と鑑定評価","b":["公示価格：国土交通省、毎年1月1日時点を3月に公表。土地取引の目安。","基準地価：都道府県、7月1日時点を9月に公表。","相続税路線価：国税庁、1月1日時点を7月に公表。公示価格の約80％。","固定資産税評価額：市町村、3年ごとに評価替え。公示価格の約70％。","鑑定評価の3つの方法：原価法（作り直す費用から）、取引事例比較法（似た取引から）、収益還元法（家賃などの収益から）。","収益還元法には、1年の純収益÷還元利回りの直接還元法と、毎年の収益と売却額を現在価値にするDCF法がある。"],"c":"「公示100、路線価80、固定資産税70」"},{"id":"E03","f":"E","n":"売買契約と宅建業法","b":["媒介契約：一般（ほかにも頼める）、専任（2週間に1回以上報告、レインズ登録7日以内）、専属専任（1週間に1回以上報告、5日以内）。専任系は有効期間3カ月まで。","仲介手数料の上限：売買400万円超は「3％＋6万円」＋消費税。賃貸は貸主・借主合計で家賃1カ月分＋消費税。","重要事項説明は契約前に宅地建物取引士が取引士証を見せて行う。","業者が売主で買主が一般人：手付は代金の2割まで（すべて解約手付）、損害賠償の予定と違約金の合計も2割まで。","手付解除：相手が履行に着手する前なら、買主は手付を放棄、売主は倍額を現実に提供して解除できる。","契約不適合責任：種類・品質の不適合は知ってから1年以内に通知。業者が売主なら通知期間を引渡しから2年以上にする特約は有効。"],"c":"「専任2週・専属1週、手付は2割」"},{"id":"E04","f":"E","n":"借地借家法","b":["普通借地権：最初は30年以上、1回目の更新は20年以上、2回目以降は10年以上。","一般定期借地権：50年以上、用途自由、書面で。事業用定期借地権：10年以上50年未満、事業用だけ（居住用は不可）、公正証書で。建物譲渡特約付借地権：30年以上。","普通借家：1年未満の契約は期間の定めなしとみなす。更新しないなら満了の1年前〜6カ月前に通知（正当事由が必要）。","定期借家：書面（電磁的方法も可）で契約し、事前に「更新なし」を書面で説明。1年以上なら満了の1年前〜6カ月前に終了通知。","200㎡未満の居住用定期借家は、やむを得ない事情で1カ月前に中途解約できる。","家賃を下げない特約は無効（普通借家）、上げない特約は有効。定期借家なら増減しない特約も有効。"],"c":"「普通借地30・20・10、事業用定期は10〜50」"},{"id":"E05","f":"E","n":"区分所有法（マンション）","b":["区分所有建物は専有部分（自分の部屋）と共用部分。専有部分と敷地利用権は原則として分けて売れない。","集会の決議は原則として区分所有者と議決権の各過半数（2026年4月の改正で出席者の多数決が基本に）。","規約の変更や重大な共用部分の変更は4分の3以上。建替えは5分の4以上（一定の場合は緩和）。","管理費の滞納は、部屋を買った人にも請求できる。","管理者（理事長など）は集会の決議で選ぶ。","マンション建替え円滑化法：耐震不足などで認定を受けると、敷地売却や容積率の緩和が使える。"],"c":"「普通は過半数、規約は4分の3、建替えは5分の4」"},{"id":"E06","f":"E","n":"都市計画法・農地法など","b":["都市計画区域は市街化区域（すでに市街地・10年以内に市街化）と市街化調整区域（市街化を抑える）に分ける。市街化区域には用途地域を必ず定める。","開発許可：建物を建てるための造成。市街化区域は1,000㎡以上（三大都市圏の一部は500㎡）、市街化調整区域は原則すべて許可が必要。","農地法：農地のまま売る（3条）は農業委員会の許可。転用（4条）・転用目的の売買（5条）は知事の許可。市街化区域なら4条・5条は農業委員会への届出だけ。","相続で農地を取得したら10カ月以内に農業委員会に届出。","生産緑地：指定から30年たつと市町村に買取りを申し出られる。特定生産緑地にすると10年延長。","国土利用計画法の事後届出：市街化区域2,000㎡以上などの取引は、契約から2週間以内に買主が届け出る。"],"c":"「3条は委員会、4・5条は知事（市街化区域は届出）」"},{"id":"E07","f":"E","n":"建築基準法","b":["建物の敷地は幅4ｍ以上の道路に2ｍ以上接していないといけない（接道義務）。2項道路は道の中心から2ｍ下がった線が境界（セットバック）。","建蔽率＝建築面積÷敷地面積。防火地域で耐火建築物、または角地なら＋10％（両方で＋20％）。","容積率＝延べ面積÷敷地面積。前面道路が12ｍ未満なら「道路の幅×4/10（住居系）または6/10」と指定容積率の小さいほう。","敷地が2つの地域にまたがるとき：建蔽率・容積率は面積で加重平均、用途は面積の過半の地域、防火規制は厳しいほう。","高さ制限：低層住居専用地域・田園住居地域は10ｍか12ｍ。道路斜線はすべての地域、北側斜線は住居専用系。","既存不適格建築物は違反ではないが、建て替えるときは今の基準に合わせる。"],"c":"「道路4ｍに2ｍ接する」"},{"id":"E08","f":"E","n":"不動産を買う・持つときの税金","b":["不動産取得税：買ったとき・新築したときに都道府県が課税。相続・包括遺贈・相続人への遺贈は非課税。税率は本来4％、土地と住宅は3％（2027年3月まで）。","宅地の不動産取得税は課税標準が2分の1。新築住宅は1,200万円控除（認定長期優良住宅は1,300万円）。","登録免許税：固定資産税評価額×税率。相続0.4％、贈与2％。住宅用家屋の軽減は保存登記0.15％・移転登記0.3％・抵当権設定0.1％（自分が住む家だけ）。","固定資産税：1月1日の所有者に課税。税率1.4％。住宅用地は200㎡まで評価額の6分の1、超える部分は3分の1。","都市計画税：市街化区域の土地・建物に最高0.3％。住宅用地は200㎡まで3分の1、超える部分は3分の2。","印紙税：売買契約書などに課税。電子データの契約書にはかからない。"],"c":"「住宅用地は200㎡まで6分の1」"},{"id":"E09","f":"E","n":"不動産を売るときの税金","b":["居住用財産の3,000万円特別控除：自分が住んでいた家を売ったとき。所有期間は関係ない。配偶者・親子・生計を一にする親族への譲渡は不可。住まなくなってから3年目の年末までに売る。","軽減税率の特例：10年超所有の自宅は、6,000万円以下の部分が14.21％（3,000万円控除と併用できる）。","居住用財産の買換え特例：10年超所有・通算10年以上居住、売値1億円以下。3,000万円控除とは併用できない。","空き家の3,000万円控除：1981年5月31日以前に建てた一戸建てを相続し、売値1億円以下（相続人3人以上なら1人2,000万円）。","相続税の取得費加算：相続税の申告期限から3年以内に売れば、払った相続税の一部を取得費に足せる。空き家特例とは併用できない。","交換の特例・収用の5,000万円控除・事業用資産の買換え特例・低未利用土地の100万円控除もある。"],"c":"「自宅は3,000万円控除＋10年超で軽減税率」"},{"id":"E10","f":"E","n":"不動産の有効活用と投資判断","b":["土地活用：自己建設（自分でお金を出して建てる）、事業受託（業者に任せる、名義は地主）、等価交換（土地を出して建物の一部をもらう）、定期借地（土地を貸すだけ）、建設協力金（テナントから借りて建てる）。","NOI（純収益）＝賃貸収入－運営費用（支払利息・減価償却費は入れない）。NOI利回り＝NOI÷投資額。","DSCR＝NOI÷年間の借入金返済額。1を超えるほど返済に余裕がある。","NPV（正味現在価値）＝将来の収益と売却額の現在価値の合計－投資額。プラスなら投資の価値あり。","IRR（内部収益率）が期待する利回りを上回れば投資の価値あり。","DCF法の収益価格＝毎年の純収益×現価係数の合計＋売却額×最後の年の現価係数。"],"c":"「NPVはプラス、IRRは期待以上、DSCRは1超」"},{"id":"F04","f":"F","n":"相続人と相続分・承認と放棄","b":["相続人は配偶者（常に）＋第1順位：子、第2順位：父母など、第3順位：兄弟姉妹。","法定相続分：配偶者と子は2分の1ずつ、配偶者と親は3分の2と3分の1、配偶者と兄弟姉妹は4分の3と4分の1。","父母の片方だけ同じ兄弟姉妹は、両方同じ兄弟姉妹の半分。","代襲相続：子が先に亡くなっていれば孫が相続。兄弟姉妹の代襲は甥・姪まで。相続放棄した人の子は代襲しない。","相続放棄・限定承認は知ってから3カ月以内に家庭裁判所へ。限定承認は相続人全員で。","普通養子は実親とも親子関係が続く。特別養子は実親との関係が終わる。"],"c":"「配偶者と子は半分ずつ、親なら3分の2、兄弟なら4分の3」"},{"id":"F05","f":"F","n":"遺言と遺留分","b":["自筆証書遺言は全文・日付・氏名を自分で書いて押印（財産目録はパソコン可）。法務局に保管すれば検認不要。","公正証書遺言は公証役場で作り、証人2人以上。推定相続人や受遺者とその配偶者・直系血族は証人になれない。検認不要。","遺言はいつでも撤回できる。前の遺言と違う内容の遺言は、違う部分を撤回したとみなす。","遺留分：兄弟姉妹以外の相続人に認められる最低限の取り分。直系尊属だけなら3分の1、それ以外は2分の1。","遺留分侵害額請求はお金で請求する。知ってから1年・相続から10年で消える。","遺留分の放棄は相続前なら家庭裁判所の許可が必要。放棄しても相続人ではなくならない。"],"c":"「遺留分は原則2分の1、親だけなら3分の1、兄弟はなし」"},{"id":"F06","f":"F","n":"遺産分割と相続の手続き","b":["遺産分割の方法：現物分割、換価分割（売ってお金を分ける）、代償分割（1人が取得し、他の人にお金を払う）。","配偶者居住権：亡くなった人の家に住んでいた配偶者が無償で住み続けられる権利。原則一生。登記が必要、譲渡はできない。","配偶者短期居住権：遺産分割が決まるまで（最低6カ月）無償で住める。","遺産分割前でも預金を払い戻せる：1金融機関ごとに「預金額×3分の1×法定相続分」、上限150万円。","特別寄与料：相続人でない親族（息子の妻など）が無償で介護などをしたとき、相続人にお金を請求できる。","法定相続情報証明制度：戸籍の束の代わりに、法務局が無料で相続関係の一覧図を証明する。"],"c":"「預金の仮払いは3分の1×相続分、150万円まで」"},{"id":"F15","f":"F","n":"成年後見・相続土地国庫帰属","b":["法定後見は判断能力の程度で後見・保佐・補助の3つ。家庭裁判所が選ぶ。","成年後見人は日用品の購入以外の本人の行為を取り消せる。被保佐人の不動産売買などは保佐人の同意が必要。","補助を本人以外が請求するときは本人の同意が必要。","任意後見は元気なうちに公正証書で契約し、判断能力が落ちたら家庭裁判所が任意後見監督人を選んで始まる。","相続土地国庫帰属制度（2023年4月〜）：相続したいらない土地を国に引き取ってもらう。負担金は原則20万円。建物がある土地は不可。","共有の土地は共有者全員で申請する。"],"c":"「後見・保佐・補助の3段階」"},{"id":"F07","f":"F","n":"相続税の対象となる財産と債務控除","b":["本来の相続財産のほか、死亡保険金・死亡退職金などの「みなし相続財産」にも課税。","死亡保険金・死亡退職金の非課税：それぞれ「500万円×法定相続人の数」。相続人が受け取ったときだけ（放棄した人は使えない）。","非課税財産：墓地・仏壇、国などへの寄附、弔慰金（業務上は給料の3年分、それ以外は6カ月分）。","生前贈与の加算：暦年課税は相続前3年以内（2024年以後の贈与は段階的に7年へ）。相続時精算課税は年110万円を引いた全部。","債務控除：借入金、未払いの税金、葬式費用（通夜・本葬・火葬など）。墓地の未払代金・香典返し・法要の費用は引けない。","相続を放棄した人は債務控除できないが、実際に払った葬式費用は引ける。"],"c":"「500万円×法定相続人」"},{"id":"F08","f":"F","n":"相続税の計算と税額控除","b":["基礎控除＝3,000万円＋600万円×法定相続人の数。法定相続人の数は放棄した人も数え、養子は実子がいれば1人・いなければ2人まで。","相続税の総額：課税遺産総額を法定相続分どおりに分けたとして税率をかけ、合計する。それを実際の取得割合で分ける。","2割加算：配偶者と1親等の血族（子・親）以外。代襲相続人の孫は加算なし、孫養子（代襲でない）・兄弟姉妹は加算。","配偶者の税額軽減：1億6,000万円か法定相続分の多いほうまで税金がかからない。申告が必要。","未成年者控除：（18歳－年齢）×10万円。障害者控除：（85歳－年齢）×10万円（特別障害者は20万円）。","相次相続控除は10年以内に続けて相続があったとき。"],"c":"「3,000万＋600万×人数」"},{"id":"F09","f":"F","n":"相続税の申告と納付（延納・物納）","b":["申告・納付は相続を知った日の翌日から10カ月以内。亡くなった人の住所地の税務署へ。","基礎控除以下なら申告不要。ただし配偶者の税額軽減や小規模宅地等の特例を使うなら、税額がゼロでも申告が必要。","準確定申告（亡くなった人の所得税）は4カ月以内。","延納：金銭で一度に払えないとき、担保を出して最長20年まで分割できる（不動産の割合で期間が変わる）。","物納：延納でも払えないとき。順位は①不動産・船舶・国債・上場株など、②非上場株など、③動産。","分割がまとまらなければ法定相続分で取得したとして申告し、分割後4カ月以内に更正の請求ができる。"],"c":"「10カ月以内、準確定は4カ月」"},{"id":"F01","f":"F","n":"贈与の法律と贈与税のしくみ","b":["贈与は「あげます」「もらいます」の契約。書面によらない贈与は、渡していない部分は解除できる。","定期贈与はどちらかが亡くなると終わる。負担付贈与は負担の分を差し引いて課税。死因贈与は相続税の対象。","暦年課税：1年間（1/1〜12/31）にもらった額から110万円を引いて税率をかける。","父母・祖父母から18歳以上の子・孫への贈与は特例税率（一般より低い）。","みなし贈与：保険料を払っていない人が満期保険金を受け取る、著しく安く買う、借金を免除してもらうなど。","申告・納付は翌年2月1日〜3月15日。延納は最長5年（物納はできない）。離婚の財産分与は原則非課税。"],"c":"「1年間で110万円まで非課税」"},{"id":"F02","f":"F","n":"贈与税の特例（配偶者控除・住宅資金）","b":["贈与税の配偶者控除：婚姻20年以上の夫婦で、自宅かその購入資金を贈与したら2,000万円まで非課税（基礎控除と合わせて2,110万円）。同じ配偶者からは一生に1回。","配偶者控除の分は、相続前の贈与加算の対象にならない。","住宅取得等資金の贈与の非課税：父母・祖父母から家を買うお金をもらうと、省エネ等住宅1,000万円、それ以外500万円まで非課税（2026年12月まで）。","受贈者は18歳以上、合計所得2,000万円以下。床面積は原則50㎡以上240㎡以下。","仲介手数料・登記費用・税金に使ったお金は対象外。","教育資金・結婚子育て資金の一括贈与の非課税は新規の受付が終わっている（教育は2026年3月、結婚子育ては2025年3月まで）。"],"c":"「夫婦20年で2,000万円」"},{"id":"F03","f":"F","n":"相続時精算課税","b":["60歳以上の父母・祖父母から18歳以上の子・孫への贈与で選べる。","年110万円の基礎控除（2024年〜）を引いたあと、累計2,500万円まで非課税。超えたら一律20％。","一度選ぶと、その人からの贈与は暦年課税に戻れない。","贈与者が亡くなったら、贈与額（110万円の基礎控除分を除く）を相続財産に加えて相続税を計算し、払った贈与税は差し引く（引ききれなければ還付）。","年110万円以下なら申告不要。初めて使う年は届出書を出す。","贈与でもらった土地・建物が災害で被害を受けたら、被害分を差し引いて加算できる（2024年〜）。"],"c":"「110万円を引いて2,500万円まで、超えたら20％」"},{"id":"F10","f":"F","n":"土地・建物の評価","b":["宅地は路線価方式（市街地）か倍率方式（固定資産税評価額×倍率）。","路線価方式：路線価×奥行価格補正率×面積。角地は高いほうの路線価を正面に、側方路線影響加算をする。","借地権＝自用地評価額×借地権割合。貸宅地（底地）＝自用地評価額×（1－借地権割合）。","貸家建付地＝自用地評価額×（1－借地権割合×借家権割合×賃貸割合）。借家権割合は30％。","建物は固定資産税評価額×1.0。貸家は×（1－借家権割合×賃貸割合）。","親の土地をタダで借りて家を建てた（使用貸借）なら借地権はゼロ、土地は自用地として評価。"],"c":"「貸家建付地は1－借地権×借家権×賃貸割合」"},{"id":"F11","f":"F","n":"小規模宅地等の特例","b":["特定居住用宅地等：330㎡まで80％減。配偶者は無条件、同居の親族は申告期限まで住み続けて持ち続ける、別居の子は3年以上持ち家なし（家なき子）など。","特定事業用宅地等：400㎡まで80％減。申告期限まで事業を続けて持ち続ける。","特定同族会社事業用宅地等：400㎡まで80％減（役員である親族が取得）。","貸付事業用宅地等：200㎡まで50％減。相続前3年以内に貸付を始めたものは原則対象外。","居住用と事業用は合計730㎡まで併用できる。貸付用があると面積を調整する。","老人ホームに入っていても、要介護認定などを受けていて家を貸していなければ居住用として使える。使うには申告が必要。"],"c":"「住む330・事業400で80％、貸す200で50％」"},{"id":"F12","f":"F","n":"金融資産などの評価","b":["上場株式：課税時期の最終価格、その月・前月・前々月の毎日の終値の平均のうち、最も低い額。","個人向け国債は中途換金額。上場していない投資信託は解約価額（解約手数料・源泉税を引く）。","生命保険契約に関する権利（保険事故が起きていない契約）は解約返戻金の額。","外貨建ての財産はTTB（取引金融機関の買値）で円に換算する。","ゴルフ会員権は取引価格の70％。","定期預金は元本＋既経過利息（源泉税を引いた額）。"],"c":"「上場株は4つのうち一番低い価格」"},{"id":"F13","f":"F","n":"取引相場のない株式の評価","b":["同族株主等は原則的評価（類似業種比準方式・純資産価額方式・併用方式）、それ以外の少数株主は配当還元方式。","会社の規模（大・中・小）は従業員数・総資産・取引金額で判定。従業員70人以上は大会社。","類似業種比準価額：似た上場会社の株価をもとに、配当・利益・純資産の3つを比べて計算。斟酌率は大会社0.7・中会社0.6・小会社0.5。","純資産価額＝（相続税評価額の資産－負債－評価差額に対する法人税等相当額）÷株数。法人税等相当額の割合は37％（2026年改正で38％）。3年以内に買った土地・建物は時価で評価。","配当還元価額＝（1株当たりの年配当÷10％）×（1株当たりの資本金等÷50円）。","特定の評価会社（株式等保有特定会社・土地保有特定会社・開業3年未満など）は原則として純資産価額方式。"],"c":"「大0.7・中0.6・小0.5」"},{"id":"F14","f":"F","n":"事業承継（納税猶予・会社法）","b":["非上場株式等の納税猶予（特例措置）：後継者が相続・贈与で取得した株の相続税・贈与税を100％猶予。特例承継計画の提出期限は2027年9月30日まで延長、適用は2027年12月31日までの相続・贈与。","後継者は最大3人。贈与では後継者が代表者で、役員として一定期間あることなどが条件。","経営承継円滑化法の遺留分の特例：後継者が受け取った株を遺留分の計算から外す（除外合意）か価額を固定する（固定合意）。推定相続人全員の合意→経済産業大臣の確認→家庭裁判所の許可。","相続人等に対する売渡請求：定款に定めがあれば、会社は相続で株を取得した人に売渡しを請求できる（知ってから1年以内、株主総会の特別決議）。","自己株式の取得：特定の株主から買うには株主総会の特別決議。財源は分配可能額まで。","種類株式：議決権制限株式、拒否権付株式（黄金株）、取得条項付株式など。"],"c":"「特例措置は100％猶予、後継者3人まで」"}];
const GLOSS={"第1号被保険者":"国民年金に自分で保険料を払う人。自営業・学生・無職など（20〜59歳）。","第2号被保険者":"会社員・公務員など、厚生年金に入っている人。","第3号被保険者":"会社員・公務員に扶養されている配偶者（20〜59歳）。保険料の負担なし。","第１号被保険者":"国民年金に自分で保険料を払う人。自営業・学生・無職など（20〜59歳）。介護保険では65歳以上の人。","第２号被保険者":"会社員・公務員など、厚生年金に入っている人。介護保険では40〜64歳の医療保険加入者。","第３号被保険者":"会社員・公務員に扶養されている配偶者（20〜59歳）。保険料の負担なし。","老齢基礎年金":"国民年金から65歳から出る年金。全員共通の“1階”部分。","老齢厚生年金":"会社員だった人に、老齢基礎年金に上乗せして出る年金（“2階”部分）。","障害基礎年金":"病気やけがで障害が残ったときに国民年金から出る年金（1級・2級）。","障害厚生年金":"会社員の間に初診日がある障害に、厚生年金から出る年金（1〜3級）。","遺族基礎年金":"亡くなった人に生計を維持されていた「子のある配偶者」か「子」に出る年金。","遺族厚生年金":"会社員などが亡くなったとき、遺族に厚生年金から出る年金。","寡婦年金":"国民年金の第1号として10年以上払った夫が亡くなったとき、妻に60〜65歳の間出る年金。","死亡一時金":"国民年金を3年以上払った人が年金をもらわずに亡くなったとき、遺族に出る一時金。","中高齢寡婦加算":"夫が亡くなったとき40〜65歳の妻（子のない場合など）の遺族厚生年金に上乗せされる額。","経過的寡婦加算":"1956年4月1日以前生まれの妻に、65歳以降の遺族厚生年金に上乗せされる額。","加給年金":"厚生年金20年以上の人に、65歳未満の配偶者や子がいると上乗せされる“家族手当”。","振替加算":"加給年金が終わったあと、配偶者の老齢基礎年金に付け替えて上乗せされる額。","繰上げ":"年金を65歳より早くもらうこと。1カ月早めるごとに0.4％減る。","繰下げ":"年金を65歳より遅くもらうこと。1カ月遅らせるごとに0.7％増える（75歳まで）。","在職老齢年金":"働きながらもらう老齢厚生年金。給料と年金の合計が基準を超えると年金が減る。","標準報酬月額":"毎月の給料を区切りのいい金額に当てはめたもの。保険料や年金の計算に使う。","標準賞与額":"ボーナスの額（千円未満切捨て）。保険料や年金の計算に使う。","保険料納付済期間":"国民年金の保険料を払った期間（会社員・扶養配偶者の期間も含む）。","合算対象期間":"年金額には反映されないが、受給資格の10年には数えられる期間（カラ期間）。","受給資格期間":"年金をもらうのに必要な加入期間。老齢年金は10年。","付加年金":"国民年金の第1号が月400円多く払うと、200円×払った月数が上乗せされる年金。","国民年金基金":"自営業者など第1号のための上乗せ年金制度。掛金は全額所得控除。","確定拠出年金":"掛金を自分で運用し、成績しだいで将来の額が決まる年金（DC）。","企業型年金":"会社が掛金を出す確定拠出年金（企業型DC）。","個人型年金":"自分で掛金を出す確定拠出年金（iDeCo）。","マッチング拠出":"企業型DCで、会社の掛金に本人が上乗せして掛金を出すこと。","確定給付企業年金":"将来もらえる額が先に決まっている会社の年金（DB）。","小規模企業共済":"個人事業主や小さな会社の役員のための退職金制度。掛金は全額所得控除。","中小企業退職金共済":"中小企業が従業員のために入る国の退職金制度（中退共）。","傷病手当金":"会社員が病気やけがで仕事を休み給料が出ないとき、健康保険から出るお金（給料の約3分の2）。","出産手当金":"会社員が出産で休んだ期間に、健康保険から出るお金。","出産育児一時金":"出産したときに健康保険から出る一時金（1児50万円）。","任意継続被保険者":"退職後も最長2年、元の会社の健康保険に入り続ける人。保険料は全額自己負担。","高額療養費":"1カ月の医療費の自己負担が上限を超えたとき、超えた分が戻る制度。","基本手当":"失業したときに雇用保険から出るお金（いわゆる失業手当）。","所定給付日数":"基本手当をもらえる日数。年齢・加入期間・辞めた理由で決まる。","特定受給資格者":"倒産や解雇など、会社都合で辞めた人。基本手当の日数が多くなる。","高年齢雇用継続":"60歳以降に給料が大きく下がった人に、雇用保険から出る給付。","休業補償給付":"仕事中のけがで休んだとき、労災保険から4日目以降に出る給付（給料の60％）。","傷病補償年金":"労災のけがが1年6カ月たっても治らず重いとき、休業補償給付に代わって出る年金。","通勤災害":"通勤途中の事故によるけが。労災保険の対象。","フラット35":"住宅金融支援機構と民間金融機関が組む、最長35年の全期間固定金利の住宅ローン。","減債基金係数":"目標額を貯めるのに、毎年いくら積み立てればいいかを出す係数。","年金現価係数":"毎年一定額を受け取るのに、今いくら必要かを出す係数。","資本回収係数":"今ある元本を取り崩すと、毎年いくら受け取れるかを出す係数。","年金終価係数":"毎年一定額を積み立てると、将来いくらになるかを出す係数。","終価係数":"今のお金を複利で運用すると、将来いくらになるかを出す係数。","現価係数":"将来のお金が、今の価値でいくらかを出す係数。","責任準備金":"保険会社が将来の保険金支払いのために積み立てておくお金。","ソルベンシー・マージン比率":"保険会社が大きな災害などに耐えられるかを示す数字（支払余力）。","契約者貸付":"解約返戻金の範囲内で、保険会社からお金を借りられる制度。","自動振替貸付":"保険料が払えないとき、解約返戻金から自動で立て替えてもらう制度。","払済保険":"保険料の支払いをやめ、その時の解約返戻金で保障額を小さくして続ける方法。","延長保険":"保険料の支払いをやめ、保障額はそのままで保障期間を短くして続ける方法。","解約返戻金":"保険を途中でやめたときに戻ってくるお金。","契約転換":"今の保険を下取りにして、同じ会社の新しい保険に入り直すこと。","告知義務":"保険に入るとき、健康状態などを正直に伝える義務。","クーリング・オフ":"申し込みから一定期間なら、無条件で契約をやめられる制度（保険は8日以内）。","予定利率":"保険会社が約束した運用利回り。高いほど保険料は安い。","高予定利率契約":"破綻時に過去5年間ずっと予定利率が基準（3％など）を超えていた契約。補償率が下がる。","税制適格特約":"個人年金保険料控除を受けるための特約。年金の受け取り方などに条件がある。","リビング・ニーズ特約":"余命6カ月と診断されたら、死亡保険金を生前に受け取れる特約。","指定代理請求特約":"本人が請求できないとき、家族が代わりに保険金を請求できる特約。","先進医療特約":"国が認めた先進医療の技術料（全額自己負担）を保障する特約。","ノンフリート等級":"自動車保険の割引・割増の段階（1〜20等級）。事故で下がり、無事故で上がる。","人身傷害保険":"自動車事故で自分や同乗者がけがをしたとき、過失割合に関係なく損害額を払う保険。","自賠責保険":"車やバイクに加入が義務の保険。相手の人身事故だけを補償する。","地震保険":"地震・噴火・津波の損害を補償。火災保険とセットで、保険金額は火災保険の30〜50％。","個人賠償責任":"日常生活で他人にけがをさせたり物を壊したりしたときの賠償を補償する保険。","生産物賠償責任保険":"売った商品や仕事の結果で事故が起きたときの賠償を補償する保険（PL保険）。","施設所有（管理）者賠償責任保険":"店や施設、業務中の事故で他人に損害を与えたときの賠償を補償する保険。","請負業者賠償責任保険":"工事などの作業中に他人に損害を与えたときの賠償を補償する保険。","使用者賠償責任":"従業員の労災で、会社が負う賠償責任を補償する保険。","総合福祉団体定期保険":"会社が従業員の死亡退職金などのために入る1年更新の団体保険。","ヒューマン・ヴァリュー特約":"従業員が亡くなったとき、会社の損失（代わりの人の採用費など）を補う特約。","保険契約者保護機構":"保険会社が破綻したとき、契約者を守る仕組み（生命保険・損害保険で別々）。","ＴＴＳ":"円を外貨に替えるときのレート（銀行が外貨を売る値段）。TTMより高い。","ＴＴＢ":"外貨を円に替えるときのレート（銀行が外貨を買う値段）。TTMより安い。","ＴＴＭ":"仲値。TTSとTTBの真ん中の基準レート。","TTS":"円を外貨に替えるときのレート（銀行が外貨を売る値段）。","TTB":"外貨を円に替えるときのレート（銀行が外貨を買う値段）。","基準価額":"投資信託の1口（または1万口）あたりの値段。","個別元本":"投資信託を買ったときの、その人の平均の買値（手数料は含まない）。","普通分配金":"投資信託の分配金のうち、利益から出た部分。税金がかかる。","元本払戻金":"投資信託の分配金のうち、元本を取り崩して払った部分。税金はかからない（特別分配金）。","信託報酬":"投資信託を持っている間、毎日差し引かれる運用の手数料。","信託財産留保額":"投資信託を解約するときに差し引かれ、ファンドに残すお金。","デュレーション":"債券の投資金額を回収するまでの平均期間。金利が変わったときの値動きの大きさの目安。","最終利回り":"今の値段で債券を買い、満期まで持ったときの1年あたりの利回り。","直接利回り":"債券の値段に対する、毎年の利子の割合。","応募者利回り":"新しく発行された債券を買い、満期まで持ったときの利回り。","割引債":"利子がない代わりに、額面より安く買えて満期に額面で戻ってくる債券。","利付債":"定期的に利子が支払われる債券。","ＲＯＥ":"自己資本利益率。株主のお金でどれだけ利益を出したか（当期純利益÷自己資本）。","ＲＯＡ":"総資産利益率。会社の全資産でどれだけ利益を出したか。","ＰＥＲ":"株価収益率。株価が1株あたり利益の何倍か（株価÷EPS）。","ＰＢＲ":"株価純資産倍率。株価が1株あたり純資産の何倍か（株価÷BPS）。","ＥＰＳ":"1株あたりの当期純利益。","ＢＰＳ":"1株あたりの純資産。","配当性向":"利益のうち、配当に回した割合。","配当利回り":"株価に対する1年間の配当の割合。","サスティナブル成長率":"会社が自分の利益だけで成長できる率（ROE×内部留保率）。","配当割引モデル":"将来もらえる配当を今の価値に直して合計し、株価を計算する方法。","シャープ・レシオ":"リスク（標準偏差）1単位あたり、どれだけ余分にもうけたかを示す数字。","トレイナー":"市場との連動度（β）1単位あたり、どれだけ余分にもうけたかを示す数字（トレイナーの測度）。","ジェンセンのアルファ":"CAPMで計算した期待どおりの収益より、どれだけ多くもうけたか。","インフォメーション・レシオ":"ベンチマークをどれだけ上回ったかを、そのブレの大きさで割った数字。","トラッキング・エラー":"ファンドの成績とベンチマークの成績のズレの大きさ。","トラッキングエラー":"ファンドの成績とベンチマークの成績のズレの大きさ。","標準偏差":"成績のばらつき（リスク）の大きさ。","共分散":"2つの資産が同じ方向に動くかどうかを表す数字。","相関係数":"2つの資産の動きの似かた（－1〜＋1）。＋1なら完全に同じ動き。","システマティック・リスク":"市場全体の動きによるリスク。分散投資しても消せない。","アンシステマティック・リスク":"個別の会社だけのリスク。分散投資で減らせる。","資本資産評価モデル":"市場との連動度（β）から、期待される収益率を計算する理論（CAPM）。","効率的フロンティア":"同じリスクで最も高い収益が期待できる組合せを結んだ線。","コール・オプション":"決まった値段で「買う」権利。","プット・オプション":"決まった値段で「売る」権利。","オプション料":"オプション（権利）を買うときに払う代金（プレミアム）。","キャップ":"金利の上限を決めて、それを超えたら差額を受け取れる権利。","フロア":"金利の下限を決めて、それを下回ったら差額を受け取れる権利。","スワップ":"金利や通貨の支払いを、相手と交換する取引。","先物取引":"将来の決まった日に、今決めた値段で売買を約束する取引。","信用取引":"証券会社にお金や株を借りて売買する取引。","逆日歩":"信用取引で売る株が不足したとき、売り方が払う追加の費用（品貸料）。","追証":"信用取引で損が出て保証金が足りなくなったとき、追加で入れるお金（追加保証金）。","外国為替証拠金取引":"証拠金を預けて、その何倍もの外貨を売買する取引（FX）。個人は25倍まで。","ＦＸ":"証拠金を預けて、その何倍もの外貨を売買する取引（外国為替証拠金取引）。","ＭＭＦ":"安全性の高い短期の債券などで運用する投資信託。","ＭＲＦ":"証券口座のお金の置き場として使う、安全性の高い投資信託。","ＥＴＦ":"取引所に上場していて、株と同じように売買できる投資信託。","ＲＥＩＴ":"投資家から集めたお金で不動産に投資し、家賃収入などを分配する上場商品。","Ｊ-ＲＥＩＴ":"日本の取引所に上場している不動産投資信託。","ＮＩＳＡ":"投資の利益に税金がかからない制度。年360万円、一生で1,800万円まで。","特定口座":"証券会社が年間の損益を計算してくれる口座。源泉徴収ありを選ぶと申告不要にできる。","源泉徴収選択口座":"特定口座のうち、税金を証券会社が天引きしてくれる口座。","預金保険制度":"銀行が破綻したとき、1人1,000万円とその利息までの預金を守る制度。","決済用預金":"利息がつかない・いつでも引き出せる・決済に使える預金。全額保護される。","インサイダー取引":"会社の重要な秘密情報を知った人が、公表前に株を売買すること。禁止されている。","消費者契約法":"事業者と消費者の契約で、消費者を守るための法律。","金融サービス提供法":"金融商品の説明義務などを定め、説明不足で損をした人を守る法律。","ＧＤＰ":"国内総生産。国内で1年間に新しく生み出されたもの・サービスの価値の合計。","消費者物価指数":"家庭が買うもの・サービスの値段の動きを表す指数（CPI）。総務省が公表。","企業物価指数":"企業どうしで取引するものの値段の動きを表す指数。日本銀行が公表。","景気動向指数":"景気の動きを表す指数。先に動く先行系列、同時の一致系列、後から動く遅行系列がある。","マネーストック":"世の中（個人や企業など）に出回っているお金の量。","総合課税":"ほかの所得と合計して、累進税率（5〜45％）で税金を計算する方法。","申告分離課税":"ほかの所得と分けて、決まった税率で税金を計算し、確定申告する方法。","源泉分離課税":"支払いのときに税金が天引きされて終わる方法。確定申告できない。","源泉徴収":"支払う側が、税金をあらかじめ差し引いて国に納めること。","確定申告":"1年間の所得と税金を自分で計算して、翌年3月15日までに税務署に出すこと。","準確定申告":"亡くなった人の所得税の申告。相続人が4カ月以内に行う。","年末調整":"会社が、1年分の給料の税金を12月に計算し直して精算すること。","損益通算":"ある所得の赤字を、ほかの所得の黒字から差し引くこと。","繰越控除":"引ききれなかった赤字を、翌年以降の所得から差し引くこと。","所得控除":"税金を計算する前に所得から差し引ける金額（基礎控除・配偶者控除など）。","税額控除":"計算した税金から直接差し引ける金額（住宅ローン控除・配当控除など）。","合計所得金額":"各所得を合計した金額（損益通算後、繰越控除前）。控除の所得要件に使う。","総所得金額":"総合課税の所得を合計した金額（損益通算・繰越控除後）。","配当控除":"総合課税を選んだ上場株式などの配当について、税金から差し引ける額。","退職所得控除":"退職金から差し引ける額。勤続20年までは1年40万円、20年超は1年70万円。","給与所得控除":"給料から差し引ける、会社員の“経費”にあたる額。","青色申告":"きちんと帳簿をつける約束をした人の申告。最大65万円の特別控除などの特典がある。","青色事業専従者":"青色申告の事業を手伝う、生計を一にする家族。給与を経費にできる。","一時所得":"懸賞金や満期保険金など、一時的な所得。50万円の特別控除があり、2分の1だけ課税。","雑所得":"ほかのどれにも当たらない所得（公的年金・副業など）。","譲渡所得":"土地や株などを売ってもうけた所得。","不動産所得":"土地や建物を貸して得た所得。","事業所得":"商売や農業など、事業でもうけた所得。","利子所得":"預金や債券の利子による所得。","配当所得":"株の配当や投資信託の分配金による所得。","必要経費":"収入を得るために使ったお金。所得の計算で収入から差し引ける。","減価償却":"建物や機械の購入代金を、使える年数に分けて少しずつ経費にすること。","耐用年数":"建物や機械を何年かけて経費にするかの年数（法律で決まっている）。","損金":"法人税の計算で経費として認められるもの。","益金":"法人税の計算で収入として数えるもの。","損金算入":"法人税の計算で経費として差し引くこと。","損金不算入":"会計上は費用でも、法人税の計算では経費として認めないこと。","益金不算入":"会計上は収入でも、法人税の計算では収入に数えないこと。","損金経理":"会社の決算で費用として処理すること（経費にする条件になることがある）。","定期同額給与":"役員に毎月同じ額を払う給与。損金になる。","事前確定届出給与":"役員に払う賞与の額と時期を事前に税務署に届けたもの。届出どおりなら損金。","業績連動給与":"会社の業績に連動して決まる役員給与。","交際費":"取引先の接待や贈り物など、取引先との付き合いのための支出。","欠損金":"法人税でいう赤字。翌年以降に繰り 。","市街化調整区域":"街にするのをおさえる区域。原則、建物を建てられない。","都市計画区域":"都市計画法で、まとまった街として整備する区域。","準都市計画区域":"都市計画区域の外で、放っておくと乱開発のおそれがある区域。","開発許可":"建物を建てるための土地の造成（開発行為）に必要な都道府県知事などの許可。","開発行為":"建物を建てる目的で、土地の区画や形を変えること。","建蔽率":"敷地面積に対する、建物を真上から見た面積（建築面積）の割合。","容積率":"敷地面積に対する、建物の床面積の合計（延べ面積）の割合。","斜線制限":"道路や隣の土地の日当たり・風通しを守るため、建物の高さを斜めの線で制限するルール。","日影規制":"周りに一定時間以上の日影をつくらないよう、建物の高さを制限するルール。","セットバック":"道幅4ｍ未満の道路に面した土地で、道路の中心から2ｍ下がること。","接道義務":"建物の敷地は、幅4ｍ以上の道路に2ｍ以上接していなければならないルール。","不動産取得税":"土地や建物を買ったりもらったりしたときに一度だけかかる都道府県の税金。相続では非課税。","登録免許税":"登記をするときにかかる国の税金。","都市計画税":"市街化区域の土地・建物にかかる市町村の税金（最高0.3％）。","固定資産税":"毎年1月1日に土地・建物を持っている人にかかる市町村の税金（標準1.4％）。","住宅用地":"住宅が建っている土地。固定資産税が200㎡まで6分の1、超える部分は3分の1になる。","仮登記":"本登記の順番を確保しておくための登記。それだけでは第三者に対抗できない。","表題部":"登記記録のうち、土地や建物の場所・広さなどが書かれた部分。","権利部":"登記記録のうち、所有権（甲区）や抵当権など（乙区）が書かれた部分。","抵当権":"お金を貸した人が、返してもらえないとき土地や建物を売って回収できる権利。","手付":"契約のときに買主が売主に渡すお金。解約手付なら放棄（倍返し）で解除できる。","契約不適合責任":"引き渡したものが契約の内容と違ったとき、売主が負う責任。","重要事項説明":"宅地建物取引士が、契約前に物件の大事な情報を説明すること。","媒介契約":"不動産会社に売買や賃貸の相手探しを頼む契約（一般・専任・専属専任）。","ＤＣＦ法":"将来の家賃収入などと売却額を、今の価値に直して合計し、不動産の価格を出す方法。","ＮＰＶ":"正味現在価値。将来の収益の今の価値から、投資額を引いた額。プラスなら投資の価値あり。","ＩＲＲ":"内部収益率。投資の利回り。期待する利回りより高ければ投資の価値あり。","ＤＳＣＲ":"借入金の返済額に対して、家賃などの純収益が何倍あるか。1より大きいほど安全。","ＮＯＩ":"家賃収入から運営費用を引いた純収益。","等価交換":"地主が土地を出し、業者が建物を建て、出した割合に応じて土地と建物を分け合う方法。","買換え":"不動産を売って、別の不動産を買うこと。特例で税金を先送りできる場合がある。","低未利用土地":"使われていない、または使い方が少ない土地（空き地・空き家など）。","法定相続人":"法律で決まった相続人（配偶者と、子→親→兄弟姉妹の順）。","法定相続分":"法律で決まった相続の割合の目安。","代襲相続":"相続人になるはずの子が先に亡くなっているとき、その子（孫）が代わりに相続すること。","普通養子":"実の親との親子関係も続いたまま、養親の子になる養子。","特別養子":"実の親との親子関係が終わり、養親の実の子と同じになる養子。","単純承認":"借金も含めて、全部を相続すること。","限定承認":"もらった財産の範囲内でだけ借金を払う条件で相続すること。相続人全員で行う。","相続の放棄":"財産も借金も一切相続しないこと。家庭裁判所に3カ月以内に申し出る。","相続放棄":"財産も借金も一切相続しないこと。家庭裁判所に3カ月以内に申し出る。","遺留分":"兄弟姉妹以外の相続人に、最低限保障されている取り分。","遺留分侵害額":"遺留分より少ししかもらえなかったとき、多くもらった人に請求できるお金。","特別受益":"一部の相続人が生前にもらった大きな贈与など。相続分の計算で考慮される。","寄与分":"家業を手伝ったり介護したりして財産を増やした（守った）相続人の取り分の上乗せ。","特別寄与料":"相続人ではない親族（息子の妻など）が介護などをしたとき、相続人に請求できるお金。","遺贈":"遺言で財産をあげること。","死因贈与":"「自分が死んだらあげる」という贈与の約束（契約）。","負担付贈与":"もらう人に一定の義務（借金の返済など）を負わせる贈与。","自筆証書遺言":"本人が全文・日付・氏名を手書きして押印する遺言。財産目録はパソコン可。","公正証書遺言":"公証人が作る遺言。証人2人以上が必要で、家庭裁判所の検認はいらない。","検認":"家庭裁判所で遺言書の状態を確認する手続き。自筆証書遺言（法務局保管を除く）で必要。","遺言執行者":"遺言の内容を実現するための手続きをする人。","配偶者居住権":"夫や妻が亡くなったあと、残された配偶者がその家に無料で住み続けられる権利。","遺産分割":"相続人の間で、誰がどの財産をもらうかを決めること。","代償分割":"1人が財産をもらい、ほかの相続人にお金を払って調整する分け方。","みなし相続財産":"死亡保険金や死亡退職金など、本来の遺産ではないが相続税がかかる財産。","死亡保険金の非課税":"死亡保険金のうち「500万円×法定相続人の数」まで相続税がかからない。","遺産に係る基礎控除":"相続税がかからない枠。3,000万円＋600万円×法定相続人の数。","基礎控除":"税金がかからない枠。所得税・相続税・贈与税それぞれにある。","債務控除":"相続財産から差し引ける借金や葬式費用。","配偶者に対する相続税額の軽減":"配偶者は1億6,000万円か法定相続分までなら相続税がかからない制度。","相次相続控除":"10年以内に続けて相続があったとき、前の相続税の一部を差し引ける制度。","2割加算":"配偶者・子・親以外（孫・兄弟姉妹など）が相続すると、相続税が2割増しになる。","小規模宅地等の特例":"自宅や事業用の土地の評価を、一定の面積まで最大80％下げられる特例。","特定居住用宅地等":"小規模宅地等の特例で、自宅の土地。330㎡まで80％減額。","貸付事業用宅地等":"小規模宅地等の特例で、貸している土地。200㎡まで50％減額。","特定事業用宅地等":"小規模宅地等の特例で、事業に使っている土地。400㎡まで80％減額。","暦年課税":"1年間（1〜12月）にもらった贈与の合計から110万円を引いて税金を計算する方法。","相続時精算課税":"60歳以上の親・祖父母からの贈与で、2,500万円まで贈与税がかからず、相続のときに精算する制度。","特定贈与者":"相続時精算課税を選んだ贈与をした人（親や祖父母）。","贈与税の配偶者控除":"結婚20年以上の夫婦で、自宅や自宅を買うお金を贈与すると2,000万円まで非課税になる制度。","特例贈与財産":"18歳以上の子や孫が、親や祖父母からもらった財産。贈与税が安い税率になる。","一般贈与財産":"特例贈与財産以外の贈与（兄弟や配偶者からなど）。","延納":"税金を分割で納めること。利子税がかかる。","物納":"お金の代わりに、不動産などの財産で相続税を納めること。","取引相場のない株式":"上場していない会社の株。会社の規模や株主の立場で評価方法が変わる。","類似業種比準方式":"似た業種の上場会社の株価をもとに、配当・利益・純資産を比べて評価する方法。","純資産価額方式":"会社の資産から負債を引いた純資産をもとに、株を評価する方法。","配当還元方式":"配当の額をもとに株を評価する方法。経営に関わらない少数株主向け。","同族株主":"株主のグループで議決権の30％以上（50％超のグループがあればそのグループ）を持つ株主。","中心的な同族株主":"同族株主のうち、本人と近い親族で議決権25％以上を持つ株主。","株式等保有特定会社":"資産の50％以上が株式の会社。原則、純資産価額方式で評価。","土地保有特定会社":"資産の多くが土地の会社。原則、純資産価額方式で評価。","事業承継税制":"後継者が非上場株式を相続・贈与で受けたとき、税金の支払いが猶予・免除される制度。","納税猶予":"一定の条件を満たす間、税金の支払いを待ってもらえる制度。","遺留分に関する民法の特例":"後継者がもらった自社株を、遺留分の計算から外したり評価を固定したりできる特例。","除外合意":"後継者がもらった自社株を、遺留分の計算から外すという合意。","固定合意":"後継者がもらった自社株の価額を、合意したときの値段で固定するという合意。","自己株式":"会社が自分で持っている自分の会社の株（金庫株）。議決権も配当もない。","金庫株":"会社が自分で持っている自分の会社の株（自己株式）。","種類株式":"議決権がないなど、ふつうの株と権利の内容が違う株。","黄金株":"重要な決定を拒否できる権利がついた株（ /* ===== 電卓（計算問題のとき表示） ===== */
const isCalcQ=q=>!!q.oyo||!!q.img||/^答え：/.test(q.q||"");
let CALC={id:null,ex:"",open:false};
const calcShow=t=>t.replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−");
function calcEval(src){
  let i=0;const s=src;
  const num=()=>{const m=/^\d*\.?\d+|^\d+\./.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const prim=()=>{if(s[i]==="("){i++;const v=expr();if(s[i]===")")i++;return v}return num()};
  const unary=()=>{if(s[i]==="-"){i++;return -unary()}if(s[i]==="√"){i++;const v=unary();if(v<0)throw 0;return Math.sqrt(v)}let v=prim();while(s[i]==="%"){i++;v/=100}return v};
  const pow=()=>{const b=unary();if(s[i]==="^"){i++;return Math.pow(b,pow())}return b};
  const term=()=>{let v=pow();while(s[i]==="*"||s[i]==="/"){const o=s[i++];const r=pow();v=o==="*"?v*r:v/r}return v};
  function expr(){let v=term();while(s[i]==="+"||s[i]==="-"){const o=s[i++];const r=term();v=o==="+"?v+r:v-r}return v}
  const v=expr();if(i<s.length||!isFinite(v))throw 0;return v;
}
function calcFmt(v){const r=Math.round(v*1e8)/1e8;return r.toLocaleString("ja-JP",{maximumFractionDigits:8})}
function calcHTML(q){
  if(CALC.id!==q.id){CALC={id:q.id,ex:"",open:CALC.open}}
  const K=[["C","AC"],["(","("],[")",")"],["⌫","BS"],["√","√"],["^","^"],["%","%"],["÷","/"],["7","7"],["8","8"],["9","9"],["×","*"],["4","4"],["5","5"],["6","6"],["−","-"],["1","1"],["2","2"],["3","3"],["＋","+"],["0","0"],["00","00"],[".","."],["＝","EQ"]];
  return `<details class="calc" ${CALC.open?"open":""}><summary>🧮 電卓を使う</summary>
    <div class="disp" aria-live="polite"><div class="ex" id="cex"></div><div class="res" id="cres"></div></div>
    ${SR?`<button class="btn block" id="cmic" style="margin:6px 0">🎤 声で計算（例：30万かける7.125わる1000）</button>`:""}
    <div class="keys">${K.map(([t,k])=>`<button class="btn ${/^[\d.]+$/.test(k)?"":"op"} ${k==="EQ"?"primary":""}" data-ck="${k}" aria-label="${t==="^"?"累乗":t==="√"?"ルート":t==="⌫"?"1文字消す":t==="C"?"クリア":t}">${t}</button>`).join("")}</div>
    <p class="note" style="margin:6px 0 0">√ はルート、^ は累乗（例：1.03^5）、% は100分の1。式の途中でも答えが表示されます。音声モード中は「計算、〇〇かける〇〇」と言うだけでも計算できます。</p></details>`;
}
function calcBind(q){
  const box=V.querySelector(".calc");if(!box)return;
  const ex=box.querySelector("#cex"),res=box.querySelector("#cres");
  const show=()=>{ex.textContent=calcShow(CALC.ex)||"0";let r="";if(CALC.ex){try{r="＝ "+calcFmt(calcEval(CALC.ex))}catch(e){r=""}}res.textContent=r};
  box.addEventListener("toggle",()=>{CALC.open=box.open});
  box.querySelectorAll("[data-ck]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.ck;
    if(k==="AC")CALC.ex="";
    else if(k==="BS")CALC.ex=CALC.ex.slice(0,-1);
    else if(k==="EQ"){try{CALC.ex=String(Math.round(calcEval(CALC.ex)*1e10)/1e10)}catch(e){res.textContent="式を確認してください";return}}
    else CALC.ex+=k;
    show();
  }));
  show();
  box.querySelector("#cmic")?.addEventListener("click",()=>{
    if(!SR||vMicBlocked){res.textContent="このページではマイクが使えません";return}
    const was=vOn;vStop();vOn=was;res.textContent="🎤 式を話してください（例：30万かける7.125わる1000）";
    beep();
    vCollect("",{gap:2500,first:10000,endRe:CALC_END,onUpdate:t=>{res.textContent="🎤 "+t}},t=>vCalcSay(t,null,true),()=>{res.textContent="聞き取れませんでした。もう一度押してください"});
  });
}
/* ===== 声で電卓 =====
   「計算、30万かける7.125わる1000かける194」のように話すと、式にして計算し、答えを読み上げる。
   出題中・解説中・応用編のどの場面でも使える（「計算」で始めるか、数字と＋−×÷が入った言葉を計算とみなす） */
const CALC_HEAD=/^\s*(計算|けいさん|ケイサン|電卓|でんたく|デンタク)[、。,\s]*/;
function jaNum(s){
  // 「30万」「1億2,000万」「三十万」「1.5万」→ 数
  const D="〇一二三四五六七八九",SU={"十":10,"百":100,"千":1000},BU={"万":1e4,"億":1e8,"兆":1e12};
  let total=0,sec=0,cur="";
  for(const c of s){
    const k=D.indexOf(c);
    if(k>=0)cur+=k;else if(/[0-9.]/.test(c))cur+=c;
    else if(SU[c]){sec+=(cur?parseFloat(cur):1)*SU[c];cur=""}
    else if(BU[c]){sec+=cur?parseFloat(cur):0;total+=(sec||1)*BU[c];sec=0;cur=""}
  }
  return total+sec+(cur?parseFloat(cur):0);
}
function speechToExpr(t){
  let s=String(t).replace(CALC_HEAD,"").normalize("NFKC")
    .replace(/[,，、\s]|円|えん|は(いくら|何|なに)?[？?]*$|いくら[？?]*$|イコール|=$/g,"")
    .replace(/(\d)\s*(てん|点|ポイント)\s*(\d)/g,"$1.$3")
    .replace(/かっことじ|カッコ閉じ|かっこ閉じ|括弧閉じ|とじかっこ|閉じかっこ/g,")").replace(/かっこ|カッコ|括弧/g,"(")
    .replace(/の?([0-9０-９]+)割(?![るっ])/g,"*($1/10)").replace(/([0-9０-９]+)倍/g,"*$1")
    .replace(/たして|足して|たす|足す|プラス|\+/g,"+").replace(/ひいて|引いて|ひく|引く|マイナス|−|ー(?=\d)/g,"-")
    .replace(/かけて|掛けて|かける|掛ける|カケル|[×✕xX＊]/g,"*").replace(/わって|割って|わる|割る|ワル|[÷／]/g,"/")
    .replace(/パーセント|%/g,"%").replace(/ルート|√/g,"√")
    .replace(/の?(2|二)乗/g,"^2").replace(/の?(\d+)乗/g,"^$1");
  s=s.replace(/[0-9.〇一二三四五六七八九十百千万億兆]+/g,m=>/^[.]+$/.test(m)?m:String(jaNum(m)));
  s=s.replace(/([\d.]+)分の([\d.]+)/g,"($2/$1)");
  // 「〇〇のルート」：最後に言ったら式全体の、途中なら直前の数の平方根
  if(/の?√$/.test(s))s="√("+s.replace(/の?√$/,"")+")";
  s=s.replace(/([\d.]+|\([^()]*\))の?√/g,"√$1");
  speechToExpr.junk=s.replace(/えーと|えっと|あのー?|その|ほな|ほんで|そんで|ほいで|それから|全部|ぜんぶ|お願い|おねがい|ちょうだい|して|やって|しといて|ください|です|ます|答え|こたえ|なんぼ|いくら|って|[でをのがはねよなやわん]/g,"").replace(/[0-9.+\-*/^√%()]/g,"");
  return s.replace(/[^0-9.+\-*/^√%()]/g,"");
}
// 式を読み上げ用の言葉にする（「300000*7.125/1000」→「30万 かける 7.125 わる 1000」）
function exprSay(ex){
  const n=x=>{const v=parseFloat(x);if(!isFinite(v))return x;if(Number.isInteger(v)&&v>=10000){const o=Math.floor(v/1e8),m=Math.floor(v%1e8/1e4),r=v%1e4;return (o?o+"億":"")+(m?m+"万":"")+(r?r:"")}return x};
  return ex.replace(/[\d.]+/g,n).replace(/\*/g,"かける").replace(/\//g,"わる").replace(/\+/g,"たす").replace(/-/g,"ひく")
    .replace(/\^(\d+)/g,"の$1乗").replace(/√/g,"ルート").replace(/%/g,"パーセント").replace(/\(/g,"かっこ").replace(/\)/g,"かっことじ");
}
// AIに式へ直してもらう（アプリで式にできなかったときだけ）。答えの計算はAIにさせず、必ずアプリの電卓で計算する
const CALC_SYS="あなたは音声電卓の式づくり係です。スマホの音声認識で聞き取った日本語（関西弁・言い間違い・聞き間違い・同音異義語を含む）を、意図をくみ取って電卓の式に直してください。出力は式1行だけ。使ってよい文字は 0-9 . + - * / ^ ( ) だけ（ルートは sqrt( ) と書く、パーセントは /100 にする）。万・億・千は数字に展開する（30万→300000）。「春」「貼る」は割る、「欠ける」「駆ける」は掛ける、「足す」「出す」は足すのように、計算の言葉の聞き間違いは直す。計算と関係ない言葉は無視。どうしても式にできないときは NG とだけ出力。";
async function aiExpr(heard){
  if(!aiKey())return null;
  const a=await aiCall([{role:"user",parts:[{text:"聞き取った言葉："+heard}]}],null,{sys:CALC_SYS,temp:0});
  let ex=String(a||"").split("\n").map(x=>x.trim()).find(x=>x&&!/^```/.test(x))||"";
  if(/NG/i.test(ex))return null;
  ex=ex.replace(/[＝=].*$/,"").replace(/\s/g,"").replace(/×/g,"*").replace(/÷/g,"/").replace(/sqrt/gi,"√").normalize("NFKC");
  if(!ex||/[^0-9.+\-*/^√%()]/.test(ex))return null;
  try{calcEval(ex);return ex}catch(e){return null}
}
// 計算の言葉らしいか（「計算」で始まる、または数字が2つ以上と＋−×÷がある）
function isCalcSpeech(t){
  t=String(t);if(CALC_HEAD.test(t))return true;
  const n=(t.normalize("NFKC").match(/\d+/g)||[]).length;
  return n>=2&&/たす|足す|プラス|ひく|引く|マイナス|かける|掛ける|わる|割る|[+×✕÷*/]/.test(t);
}
// 計算して、電卓に出して、式と答えを読み上げる（cb：読み終わったら続ける処理）
// ①アプリで式にする → ②言葉が残って式にできなければAI（Gemini）に式へ直してもらう → ③「式で、答え」と読む
async function vCalcSay(t,cb,always){
  const heard=String(t||"").replace(CALC_HEAD,"").trim();
  let ex="",v=null,via="";
  try{ex=speechToExpr(heard);if(ex&&!speechToExpr.junk)v=calcEval(ex)}catch(e){v=null}
  if(v===null&&heard){
    vStatus("🧮 「"+heard+"」をAIで式に直しています…");
    const ae=await aiExpr(heard).catch(()=>null);
    if(ae){ex=ae;try{v=calcEval(ex);via="AI"}catch(e){v=null}}
  }

  const noAI=v===null&&heard&&!aiKey();   // AIが使えない（キー未設定・claude.ai版）ときは、まちがった式で計算しない

function answer(q,pick){
  const ok=pick===q.a;   // pick==="u"（わからない）は不正解あつかい
  session.answered={ok,pick};
  if(S.pass&&S.pass[q.id])delete S.pass[q.id];
  if(ok)session.ok++;else session.ng++;
  S.log[today()]=(S.log[today()]||0)+1;
  renderQuiz();
}
function rate(q,how,res){
  if(q.dojo){S.dojo=S.dojo||{};const d=S.dojo[q.id]||{n:0,ok:0};d.n++;if(how!=="wrong")d.ok++;d.lr=how==="wrong"?"x":"o";d.t=today();S.dojo[q.id]=d;save();session.i++;session.answered=null;renderQuiz();window.scrollTo(0,0);return}
  // 1問にかかった時間（出題〜次へ）を記録。10分を超えたら席を外していたとみなして記録しない
  const first=!S.cards[q.id],c=S.cards[q.id]||{b:0,c:0,w:0};
  // 1問にかかった時間（出題〜次へ。解説・家庭教師の時間も含む）。長すぎる分は上限で止めて記録（捨てると短めに出てしまうため）
  // レッスンの見積もりには「初めて解いた問題」の時間を使う（復習は速いので別に記録）
  if(session&&session.t0id===q.id){const sec=Math.round((clock()-session.t0)/1000);if(sec>=3){const k=(q.oyo?"o":"b")+(first?"1":"");tmPush(k,Math.min(sec,q.oyo?2400:480),q.oyo?20:60)}}
  if(!first&&session&&session.lap===2)c.l2=today();
  if(first){S.nlog=S.nlog||{};S.nlog[today()]=(S.nlog[today()]||0)+1;if(!S.nlogStart)S.nlogStart=today()}   // ペース用：初めて解いた問題の数
  if(how==="wrong"){c.b=0;c.w++;c.lr="x";c.d=addDays(STEPS[0])}
  else if(how==="unsure"){c.c++;c.lr="o";c.b=1;c.d=addDays(STEPS[1])}
  else if(first||(c.b||0)>=2){c.c++;c.lr="o";c.b=STEPS.length-1;c.d=GRAD}   // 卒業
  else{c.c++;c.lr="o";c.b=2;c.d=addDays(STEPS[2])}                           // まちがえた・あやしいの後に合った→7日後
  if(res&&Object.keys(res).length){
    // 応用編は空欄ごとに次に出す日を決める。問題全体の期限は、いちばん早い空欄に合わせる
    const n=q.ans.length;c.bb=(c.bb||[]).slice(0,n);c.bd=(c.bd||[]).slice(0,n);
    for(let i=0;i<n;i++){
      if(i in res){
        if(!res[i]){c.bb[i]=0;c.bd[i]=addDays(STEPS[0])}
        else if(c.bb[i]==null||c.bb[i]>=2){c.bb[i]=STEPS.length-1;c.bd[i]=GRAD}   // 初めてで合った・2回続けて合った→卒業
        else{c.bb[i]=2;c.bd[i]=addDays(STEPS[2])}
      }
      else if(c.bd[i]==null){c.bb[i]=c.b;c.bd[i]=c.d}
    }
    c.d=c.bd.reduce((m,d)=>d<m?d:m);c.b=Math.min(...c.bb);
  }
  c.t=today();S.cards[q.id]=c;save();
  session.i++;session.answered=null;renderQuiz();window.scrollTo(0,0);
}
